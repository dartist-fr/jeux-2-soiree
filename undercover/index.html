<style>
  :root {
    --bg-color: #0b0616;
    --card-bg: #140a26;
    --grid-line: rgba(255, 46, 136, 0.10);
    --border-color: rgba(255, 46, 136, 0.35);
    --text-main: #f3e9ff;
    --text-sub: #9d8bc4;
    --accent: #ff2e88;
    --neon-yellow: #ffe14d;
    --neon-cyan: #22e6ff;
    --font-display: 'Press Start 2P', monospace;
    --font-body: 'VT323', monospace;
  }
  :root[data-theme="light"] {
    --bg-color: #cdbf9c;
    --card-bg: #e6dcc0;
    --grid-line: rgba(0, 0, 0, 0.03);
    --border-color: rgba(179, 165, 120, 0.8);
    --text-main: #241f17;
    --text-sub: #6a5f45;
    --accent: #9e2a24;
    --neon-yellow: #556021;
    --neon-cyan: #225588;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg-color); }
  body {
    font-family: var(--font-body);
    background-color: var(--bg-color);
    background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        radial-gradient(circle at 50% 0%, rgba(255, 46, 136, 0.15) 0%, transparent 55%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px 16px 60px;
    position: relative;
    font-size: 1.25rem;
  }

  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
    z-index: 100; mix-blend-mode: multiply;
  }

  #app { max-width: 600px; margin: 0 auto; position: relative; z-index: 10; }

  header {
    background: var(--card-bg);
    border: 2px solid var(--accent);
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6), 0 0 20px rgba(255,46,136,0.2);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  h1 { font-family: var(--font-display); font-size: 0.9rem; color: var(--accent); text-shadow: 0 0 8px rgba(255,46,136,0.8); margin: 0; }
  .subtitle { font-size: 1rem; color: var(--text-sub); margin-top: 4px; }
  .headerbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  
  .themebtn {
    font-family: var(--font-display); font-size: 0.5rem;
    background: rgba(255, 46, 136, 0.08); border: 2px solid var(--accent);
    color: var(--accent); padding: 8px 10px; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  }

  .panel {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6);
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 0.75rem;
    color: var(--neon-cyan);
    margin-bottom: 14px;
    text-shadow: 0 0 6px rgba(34,230,255,0.4);
  }

  input[type=text], select {
    width: 100%; background: var(--bg-color); border: 2px solid var(--border-color);
    color: var(--text-main); padding: 10px; font-size: 1.25rem; font-family: var(--font-body);
    outline: none; margin-bottom: 10px;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px; font-family: var(--font-display); font-size: 0.65rem;
    cursor: pointer; border: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
    text-transform: uppercase; text-align: center; margin-top: 10px;
  }
  .btn-primary { background: var(--accent); color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.5); }
  .btn-ghost { background: transparent; border: 2px solid var(--accent); color: var(--text-main); }
  .btn-small { width: auto; padding: 8px 12px; font-size: 0.5rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.3); border: 1px dashed var(--border-color);
    padding: 6px 10px; font-size: 1.2rem;
  }
  .chip button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.2rem; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 32px; height: 32px; background: var(--bg-color);
    border: 2px solid var(--border-color); color: var(--text-main);
    font-family: var(--font-display); font-size: 0.8rem; cursor: pointer;
  }
  .stepper .val { width: 30px; text-align: center; font-size: 1.4rem; }

  .stamp {
    display: inline-block; border: 3px double var(--accent); color: var(--accent);
    padding: 10px 20px; font-family: var(--font-display); font-size: 0.8rem;
    text-transform: uppercase; transform: rotate(-2deg); text-shadow: 0 0 6px rgba(255,46,136,0.6);
  }
  .stamp.olive { border-color: var(--neon-cyan); color: var(--neon-cyan); text-shadow: 0 0 6px rgba(34,230,255,0.6); }
  .stamp.neutral { border-color: var(--text-sub); color: var(--text-sub); }

  .wordbig { font-family: var(--font-display); font-size: 1.6rem; color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255,225,77,0.7); margin-top: 10px; }
  .center { text-align: center; }
  .dim { color: var(--text-sub); }
  .warn { color: #ff5555; font-size: 1rem; margin-top: 6px; }
  .codebox { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.2em; color: var(--neon-yellow); text-align: center; padding: 15px; background: var(--bg-color); border: 2px dashed var(--border-color); margin: 10px 0; }
  .linkbtn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; text-decoration: underline; display: block; margin: 10px auto; font-family: var(--font-body); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
</style>

var ROLE_LABEL = { civil:"Civil", undercover:"Undercover", white:"Mr. White" };

var peer = null;
var conn = null;
var connections = [];
var isHost = false;
var myName = "";
var roomCode = "";

var state = {
  gameMode: null,
  screen: "mode_select",
  playerNames:["Joueur 1","Joueur 2","Joueur 3","Joueur 4"],
  numUndercover:1, numWhite:0,
  theme:"Aléatoire", difficulty:"Aléatoire",
  isGameMaster:false, customCivil:"", customUndercover:"",
  blindMode:false,
  library:[],
  players:[], wordPair:null,
  revealIndex:0, revealed:false,
  round:1, clueOrder:[], clueTurn:0,
  eliminations:[], selectedVote:null, justEliminated:null,
  winner:null,
  themeMode:"dark"
};

function selectMode(mode) {
    state.gameMode = mode;
    state.screen = (mode === "local") ? "setup" : "net_home";
    render();
}

function generateRoomCode() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var code = "";
    for(var i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
}

function startHosting() {
    isHost = true;
    roomCode = generateRoomCode();
    
    if(peer) peer.destroy();
    peer = new Peer(roomCode);

    peer.on('open', function(id) {
        state.screen = "setup";
        render();
    });

    peer.on('connection', function(c) {
        connections.push(c);
        c.on('data', function(data) {
            if(data.type === "JOIN") {
                if(!state.playerNames.includes(data.name)) {
                    state.playerNames.push(data.name);
                }
                broadcastState();
                render();
            }
        });
    });
}

function broadcastState() {
    connections.forEach(function(c) {
        c.send({ type: "STATE_UPDATE", data: state });
    });
}

function joinRoomForm() {
    isHost = false;
    state.screen = "join_form";
    render();
}

function connectToRoom() {
    var nameInput = document.getElementById("pseudoJoin");
    var codeInput = document.getElementById("roomCodeInput");
    if(!nameInput.value.trim() || !codeInput.value.trim()) { alert("Remplis tous les champs !"); return; }
    
    myName = nameInput.value.trim();
    roomCode = codeInput.value.trim().toUpperCase();

    if(peer) peer.destroy();
    peer = new Peer();

    peer.on('open', function(id) {
        conn = peer.connect(roomCode);

        conn.on('open', function() {
            conn.send({ type: "JOIN", name: myName });
            state.screen = "waiting_room";
            render();
        });

        conn.on('data', function(data) {
            if(data.type === "STATE_UPDATE") {
                state = data.data;
                render();
            }
        });
    });
}

function loadStorage(){
  state.library = BUILTIN_PAIRS.map(function(p,i){ return { id:"b"+i, theme:p.theme, difficulty:p.difficulty, civil:p.civil, undercover:p.undercover }; });
  try{ var tm = localStorage.getItem("undercover_theme"); if(tm==="light"||tm==="dark") state.themeMode = tm; }catch(e){}
  applyTheme();
}
function applyTheme(){ document.documentElement.setAttribute("data-theme", state.themeMode); }
function toggleTheme(){
  state.themeMode = state.themeMode==="dark" ? "light" : "dark";
  try{ localStorage.setItem("undercover_theme", state.themeMode); }catch(e){}
  applyTheme();
  render();
}
function toggleFullscreen(){
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(!isFs){
    var el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
  }
}
document.addEventListener("fullscreenchange", function(){ render(); });

function addPlayer(){
  if(state.gameMode === "network" && !isHost) return;
  var input = document.getElementById("nameInput");
  var name = input.value.trim();
  if(!name) return;
  state.playerNames.push(name);
  if(state.gameMode === "network") broadcastState();
  render();
}

function removePlayer(idx){ 
  if(state.gameMode === "network" && !isHost) return;
  state.playerNames.splice(idx,1); 
  if(state.gameMode === "network") broadcastState(); 
  render(); 
}

function changeUndercover(delta){
  if(state.gameMode === "network" && !isHost) return;
  state.numUndercover = Math.max(0, Math.min(3, state.numUndercover+delta)); 
  if(state.gameMode === "network") broadcastState(); 
  render();
}

function changeWhite(delta){
  if(state.gameMode === "network" && !isHost) return;
  state.numWhite = Math.max(0, Math.min(2, state.numWhite+delta)); 
  if(state.gameMode === "network") broadcastState(); 
  render();
}

function setTheme(v){ 
  if(state.gameMode === "network" && !isHost) return;
  state.theme=v; 
  if(state.gameMode === "network") broadcastState();
}

function setDifficulty(v){ 
  if(state.gameMode === "network" && !isHost) return;
  state.difficulty=v; 
  if(state.gameMode === "network") broadcastState();
}

function toggleGameMaster(){ 
  if(state.gameMode === "network" && !isHost) return;
  state.isGameMaster = !state.isGameMaster; 
  if(state.gameMode === "network") broadcastState();
  render(); 
}

function toggleBlindMode(){ 
  if(state.gameMode === "network" && !isHost) return;
  state.blindMode = !state.blindMode; 
  if(state.gameMode === "network") broadcastState();
  render(); 
}

function allPairs(){ return state.library; }
function themesList(){
  var set = {}; allPairs().forEach(function(p){ set[p.theme]=true; });
  return ["Aléatoire"].concat(Object.keys(set).sort());
}

function startGame(){
  if(state.gameMode === "network" && !isHost) return;

  var pair = null;
  if(state.isGameMaster){
    var gmCiv = document.getElementById("gmCivil");
    var gmUnd = document.getElementById("gmUndercover");
    if(gmCiv) state.customCivil = gmCiv.value.trim();
    if(gmUnd) state.customUndercover = gmUnd.value.trim();
    if(!state.customCivil || !state.customUndercover){ alert("Veuillez renseigner les deux mots."); return; }
    pair = { theme:"Personnalisé", difficulty:"Custom", civil:state.customCivil, undercover:state.customUndercover };
  } else {
    var pool = allPairs();
    if(state.theme !== "Aléatoire") pool = pool.filter(function(p){return p.theme===state.theme;});
    if(state.difficulty !== "Aléatoire") pool = pool.filter(function(p){return p.difficulty===state.difficulty;});
    if(pool.length===0) pool = allPairs();
    pair = pool[Math.floor(Math.random()*pool.length)];
  }

  // Évite les doublons de noms pour un tirage propre
  var uniqueNames = Array.from(new Set(state.playerNames));

  var order = shuffle(uniqueNames.map(function(_,i){return i;}));
  var players = uniqueNames.map(function(name,idx){
    return { id:idx, name:name, role:"civil", word:pair.civil, alive:true };
  });
  order.slice(0,state.numUndercover).forEach(function(idx){ players[idx].role="undercover"; players[idx].word=pair.undercover; });
  order.slice(state.numUndercover, state.numUndercover+state.numWhite).forEach(function(idx){ players[idx].role="white"; players[idx].word=null; });

  state.players = players;
  state.wordPair = pair;
  state.revealIndex = 0;
  state.revealed = false;
  state.round = 1;
  state.eliminations = [];
  state.winner = null;
  state.clueOrder = shuffle(players.map(function(p){return p.id;}));
  state.clueTurn = 0;
  state.screen = "reveal";
  
  if(state.gameMode === "network") broadcastState();
  render();
}

function revealCard(){ state.revealed = true; render(); }
function nextReveal(){
  if(state.revealIndex + 1 >= state.players.length){ 
    state.screen = "clues"; 
  } else { 
    state.revealIndex++; 
    state.revealed = false; 
  }
  if(state.gameMode === "network") broadcastState();
  render();
}

function aliveClueOrder(){
  return state.clueOrder.filter(function(id){
    var p = state.players.find(function(pl){return pl.id===id;});
    return p && p.alive;
  });
}

function nextClueTurn(){
  var order = aliveClueOrder();
  if(state.clueTurn + 1 >= order.length){ 
    state.screen = "vote"; 
    state.selectedVote = null; 
  } else { 
    state.clueTurn++; 
  }
  if(state.gameMode === "network") broadcastState();
  render();
}

function selectVote(id){ 
  state.selectedVote = id; 
  render(); 
}

function confirmVote(){
  if(state.selectedVote == null) return;
  var target = state.players.find(function(p){return p.id === state.selectedVote;});
  state.justEliminated = target;
  target.alive = false;
  state.eliminations.push({ round: state.round, playerId: target.id, name: target.name, role: target.role });
  
  if(target.role === "white"){ 
    state.screen = "whiteGuess"; 
  } else { 
    state.screen = "eliminationReveal"; 
  }
  if(state.gameMode === "network") broadcastState();
  render();
}

function submitWhiteGuess(){
  var input = document.getElementById("whiteGuessInput");
  var guess = (input ? input.value : "").trim();
  var correct = guess.length > 0 && guess.toLowerCase() === state.wordPair.civil.trim().toLowerCase();
  var last = state.eliminations[state.eliminations.length - 1];
  last.whiteGuess = guess; 
  last.whiteCorrect = correct;
  
  if(correct){ 
    state.winner = "white";
    state.screen = "end"; 
  } else { 
    state.screen = "eliminationReveal"; 
  }
  if(state.gameMode === "network") broadcastState();
  render();
}

function checkWinCondition(){
  var alive = state.players.filter(function(p){return p.alive;});
  var aliveInf = alive.filter(function(p){return p.role !== "civil";}).length;
  var aliveCiv = alive.filter(function(p){return p.role === "civil";}).length;
  if(aliveInf === 0) return "civils";
  if(aliveInf >= aliveCiv) return "infiltrators";
  return null;
}

function proceedAfterElimination(){
  var result = checkWinCondition();
  if(result){ 
    state.winner = result;
    state.screen = "end"; 
    if(state.gameMode === "network") broadcastState();
    render(); 
    return; 
  }
  state.round++;
  var aliveIds = state.players.filter(function(p){return p.alive;}).map(function(p){return p.id;});
  state.clueOrder = shuffle(aliveIds);
  state.clueTurn = 0;
  state.screen = "clues";
  if(state.gameMode === "network") broadcastState();
  render();
}

function newGameSamePlayers(){ 
  state.screen = "setup"; 
  if(state.gameMode === "network") broadcastState();
  render(); 
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  var html = "";
  html += '<header><div><h1>UNDERCOVER</h1><div class="subtitle">Salle d\'Arcade &middot; Enquête</div></div>';
  html += '<div class="headerbtns">';
  html += '<button class="themebtn" onclick="toggleTheme()">'+(state.themeMode==="dark" ? "☀️" : "🌙")+'</button>';
  html += '<button class="themebtn" onclick="toggleFullscreen()">'+(isFs ? "✕" : "⛶")+'</button>';
  html += '</div></header>';

  if(state.screen === "mode_select"){
    html += '<div class="panel center">';
    html += '<h2>Choix du mode</h2>';
    html += '<p class="dim" style="margin-bottom:15px;">Comment souhaitez-vous jouer ?</p>';
    html += '<button class="btn btn-primary" onclick="selectMode(\'local\')">📱 Un seul téléphone</button>';
    html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="selectMode(\'network\')">🌐 Chacun son téléphone</button>';
    html += '</div>';
  }
  else if(state.screen === "net_home"){
    html += '<button class="linkbtn" onclick="state.screen=\'mode_select\'; render();">&#8249; Retour au choix</button>';
    html += '<div class="panel center"><h2>Mode Réseau</h2>';
    html += '<button class="btn btn-primary" onclick="startHosting()">Créer un salon</button>';
    html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="joinRoomForm()">Rejoindre un salon</button></div>';
  }
  else if(state.screen === "join_form"){
    html += '<div class="panel"><h2>Rejoindre une enquête</h2>';
    html += '<input type="text" id="pseudoJoin" placeholder="Ton pseudo">';
    html += '<input type="text" id="roomCodeInput" placeholder="Code du salon (4 lettres)" style="text-transform:uppercase;">';
    html += '<button class="btn btn-primary" onclick="connectToRoom()">Se connecter</button>';
    html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="state.screen=\'net_home\'; render();">Retour</button></div>';
  }
  else if(state.screen === "waiting_room"){
    html += '<div class="panel center"><h2>Salon d\'attente</h2>';
    html += '<p class="dim">Salon : <strong>'+roomCode+'</strong></p>';
    html += '<p class="dim" style="margin-top:15px;">En attente que l\'hôte lance la partie...</p></div>';
  }
  else if(state.screen === "setup"){
    if(state.gameMode === "network") {
      if(isHost) {
        html += '<div class="panel center"><h2>Code du salon (Hôte)</h2><div class="codebox">'+roomCode+'</div><p class="dim">Partage ce code à tes amis.</p></div>';
      } else {
        html += '<div class="panel center"><h2>Salon en cours</h2><p class="dim">Seul l\'hôte peut modifier les paramètres.</p></div>';
      }
    } else {
      html += '<button class="linkbtn" onclick="state.screen=\'mode_select\'; render();">&#8249; Changer de mode</button>';
    }
    html += renderSetupBody();
  }
  else if(state.screen === "reveal"){ html += renderReveal(); }
  else if(state.screen === "clues"){ html += renderClues(); }
  else if(state.screen === "vote"){ html += renderVote(); }
  else if(state.screen === "whiteGuess"){ html += renderWhiteGuess(); }
  else if(state.screen === "eliminationReveal"){ html += renderEliminationReveal(); }
  else if(state.screen === "end"){ html += renderEnd(); }

  document.getElementById("app").innerHTML = html;
  var ni = document.getElementById("nameInput");
  if(ni){ ni.addEventListener("keydown", function(e){ if(e.key==="Enter") addPlayer(); }); ni.focus({preventScroll:true}); }
  var wg = document.getElementById("whiteGuessInput");
  if(wg){ wg.addEventListener("keydown", function(e){ if(e.key==="Enter") submitWhiteGuess(); }); wg.focus({preventScroll:true}); }
  var pj = document.getElementById("pseudoJoin");
  if(pj){ pj.addEventListener("keydown", function(e){ if(e.key==="Enter") connectToRoom(); }); pj.focus({preventScroll:true}); }
}

function renderSetupBody(){
  var n = state.playerNames.length;
  var numCivils = n - state.numUndercover - state.numWhite;
  var tooMany = (state.numUndercover+state.numWhite) >= numCivils || numCivils<1;
  var canStart = n>=3 && !tooMany;

  var disableControls = (state.gameMode === "network" && !isHost);

  var chips = state.playerNames.map(function(name,idx){
    return '<div class="chip"><span>'+esc(name)+'</span>'+(disableControls ? '' : '<button onclick="removePlayer('+idx+')">&#10005;</button>')+'</div>';
  }).join("");

  var themes = themesList();
  var themeOpts = themes.map(function(t){ return '<option value="'+esc(t)+'"'+(t===state.theme?" selected":"")+'>'+esc(t)+'</option>'; }).join("");
  var diffs = ["Aléatoire","facile","moyen","difficile"];
  var diffOpts = diffs.map(function(d){ return '<option value="'+d+'"'+(d===state.difficulty?" selected":"")+'>'+d+'</option>'; }).join("");

  var html = "";
  html += '<div class="panel"><h2>Suspects ('+n+')</h2><div class="chips">'+chips+'</div>';
  if(!disableControls) {
    html += '<div class="inline2"><input type="text" id="nameInput" placeholder="Nom du suspect"><button class="btn btn-ghost btn-small" onclick="addPlayer()">+</button></div>';
  }
  html += '</div>';

  html += '<div class="panel"><h2>Infiltrés</h2>';
  html += '<div class="row"><span class="dim">Undercover</span><div class="stepper">'+(disableControls?'':'<button onclick="changeUndercover(-1)">&minus;</button>')+'<span class="val mono">'+state.numUndercover+'</span>'+(disableControls?'':'<button onclick="changeUndercover(1)">+</button>')+'</div></div>';
  html += '<div class="row"><span class="dim">Mr. White</span><div class="stepper">'+(disableControls?'':'<button onclick="changeWhite(-1)">&minus;</button>')+'<span class="val mono">'+state.numWhite+'</span>'+(disableControls?'':'<button onclick="changeWhite(1)">+</button>')+'</div></div>';
  html += '<div class="dim" style="font-size:1rem;margin-top:8px;">'+numCivils+' civil(s) &middot; '+state.numUndercover+' undercover &middot; '+state.numWhite+' mr. white</div>';
  if(tooMany) html += '<div class="warn">Trop d\'infiltrés ! Les civils doivent rester majoritaires.</div>';
  html += '</div>';

  html += '<div class="panel"><h2>Règles & Mots</h2>';
  html += '<label style="cursor:pointer;display:flex;align-items:center;gap:8px;" class="dim"><input type="checkbox" '+(state.isGameMaster?"checked":"")+' '+(disableControls?'disabled':'')+' onchange="toggleGameMaster()"> Mode Meneur d\'enquête</label>';
  html += '<label style="cursor:pointer;display:flex;align-items:center;gap:8px;margin-top:10px;margin-bottom:10px;" class="dim"><input type="checkbox" '+(state.blindMode?"checked":"")+' '+(disableControls?'disabled':'')+' onchange="toggleBlindMode()"> Mode Identité Secrète</label>';

  if(state.isGameMaster){
    html += '<div class="grid2"><div><span class="dim">Mot Civils</span><input type="text" id="gmCivil" value="'+esc(state.customCivil)+'" '+(disableControls?'readonly':'')+' placeholder="ex: Soleil" oninput="state.customCivil=this.value"></div><div><span class="dim">Mot Undercovers</span><input type="text" id="gmUndercover" value="'+esc(state.customUndercover)+'" '+(disableControls?'readonly':'')+' placeholder="ex: Lune" oninput="state.customUndercover=this.value"></div></div>';
  } else {
    html += '<div class="grid2"><div><span class="dim">Dossier</span><select id="themeSel" '+(disableControls?'disabled':'')+' onchange="setTheme(this.value)">'+themeOpts+'</select></div><div><span class="dim">Niveau</span><select id="diffSel" '+(disableControls?'disabled':'')+' onchange="setDifficulty(this.value)">'+diffOpts+'</select></div></div>';
  }
  html += '</div>';

  if(!disableControls) {
    html += '<button class="btn btn-primary" '+(canStart?"":"disabled")+' onclick="startGame()">Ouvrir l\'enquête</button>';
  } else {
    html += '<p class="center dim" style="margin-top:15px;">En attente que l\'hôte lance la partie...</p>';
  }
  return html;
}

function renderReveal(){
  if(state.gameMode === "network") {
    var myRole = state.players.find(function(p){ return p.name.toLowerCase() === myName.toLowerCase(); }) || state.players[0];
    var html = '<div class="panel center" style="padding:40px 18px;">';
    
    if(state.blindMode) {
        html += '<div class="stamp neutral">IDENTITÉ SECRÈTE</div>';
        html += '<p class="dim" style="margin-top:20px;">Ton mot codé secret :</p>';
        html += '<div class="wordbig">'+(myRole ? (myRole.word || "Aucun (Mr. White)") : "Mot secret")+'</div>';
    } else {
        var clsNet = myRole && myRole.role==="civil" ? "stamp olive" : "stamp";
        html += '<div class="'+clsNet+'">'+(myRole ? ROLE_LABEL[myRole.role] : "Infiltré")+'</div>';
        html += '<p class="dim" style="margin-top:20px;">Ton mot codé secret :</p>';
        html += '<div class="wordbig">'+(myRole ? (myRole.word || "Aucun (Mr. White)") : "Mot secret")+'</div>';
    }
    html += '</div>';
    return html;
  }

  var p = state.players[state.revealIndex];
  var html = '<p class="center dim" style="font-size:1.1rem;">DÉPOSITION '+(state.revealIndex+1)+' / '+state.players.length+'</p>';
  html += '<div class="panel center" style="padding:30px 18px;">';
  if(!state.revealed){
    html += '<p class="dim">Passez l\'appareil à</p><p class="wordbig" style="margin:10px 0;">'+esc(p.name)+'</p>';
    html += '<button class="btn btn-primary" style="margin-top:15px;" onclick="revealCard()">Ouvrir mon dossier</button>';
  } else {
    if(state.blindMode) {
        html += '<div class="stamp neutral">IDENTITÉ SECRÈTE</div>';
        html += '<p class="dim" style="margin-top:15px;">Mot secret :</p><p class="wordbig">'+(p.word||"Aucun")+'</p>';
    } else {
        var cls = p.role==="civil" ? "stamp olive" : "stamp";
        html += '<div class="'+cls+'">'+ROLE_LABEL[p.role]+'</div>';
        html += '<p class="dim" style="margin-top:15px;">Mot secret :</p><p class="wordbig">'+(p.word||"Aucun")+'</p>';
    }
    html += '<button class="btn btn-ghost" style="margin-top:20px;" onclick="nextReveal()">Joueur suivant &#8250;</button>';
  }
  html += '</div>';
  return html;
}

function renderClues(){
  var order = aliveClueOrder();
  var currentId = order[state.clueTurn];
  var current = state.players.find(function(p){return p.id === currentId;});
  var html = '<div class="panel center"><h2>Manche '+state.round+'</h2>';
  html += '<p class="dim">Tour de parole de</p><p class="wordbig">'+esc(current.name)+'</p>';
  html += '<p class="dim" style="margin-top:10px;font-size:1rem;">Donnez votre indice à l\'oral</p>';
  html += '<button class="btn btn-primary" style="margin-top:20px;" onclick="nextClueTurn()">Indice suivant &#8250;</button></div>';
  return html;
}

function renderVote(){
  var alive = state.players.filter(function(p){return p.alive;});
  var html = '<div class="panel center"><h2>Interrogatoire & Vote</h2><p class="dim" style="margin-bottom:10px;">Désignez le suspect à éliminer :</p>';
  alive.forEach(function(p){
    var sel = state.selectedVote === p.id;
    html += '<button class="btn '+(sel?'btn-primary':'btn-ghost')+'" style="margin-top:8px;" onclick="selectVote('+p.id+')">'+esc(p.name)+'</button>';
  });
  html += '<button class="btn btn-primary" style="margin-top:15px;" '+(state.selectedVote==null?"disabled":"")+' onclick="confirmVote()">Confirmer l\'inculpation</button></div>';
  return html;
}

function renderWhiteGuess(){
  var html = '<div class="panel center"><h2>Mr. White démasqué</h2><p class="dim">Dernière chance : devinez le mot des civils !</p>';
  html += '<input type="text" id="whiteGuessInput" placeholder="Votre déposition">';
  html += '<button class="btn btn-primary" onclick="submitWhiteGuess()">Valider</button></div>';
  return html;
}

function renderEliminationReveal(){
  var p = state.justEliminated;
  var html = '<div class="panel center"><h2>Résultat de l\'inculpation</h2>';
  html += '<p class="dim">'+esc(p.name)+' était</p><div class="stamp" style="margin:15px 0;">'+ROLE_LABEL[p.role]+'</div>';
  html += '<button class="btn btn-primary" onclick="proceedAfterElimination()">Poursuivre l\'enquête</button></div>';
  return html;
}

function renderEnd(){
  var label = state.winner==="civils" ? "Les Civils gagnent !" : (state.winner==="white" ? "Mr. White gagne !" : "Les Infiltrés gagnent !");
  var html = '<div class="panel center"><h2>Fin de l\'affaire</h2><div class="stamp olive" style="margin:20px 0;">'+label+'</div>';
  html += '<button class="btn btn-primary" onclick="newGameSamePlayers()">Nouvelle affaire</button></div>';
  return html;
}

loadStorage();
render();
</script>
</body>
