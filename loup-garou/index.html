<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0713">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Loup-Garou • jeux2soiree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0713;
            --bg-panel: #16102b;
            --card-bg: #16102b;
            --grid-line: rgba(124, 58, 237, 0.10);
            --border-color: rgba(168, 85, 247, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #a794c9;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --moon: #ffe14d;
            --red: #ff3b5c;
            --green: #4dffa6;
            --amber: #ffb14d;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% -5%, rgba(255, 225, 77, 0.16) 0%, transparent 42%),
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 60%);
            background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            overflow-x: hidden;
            font-size: 1.15rem;
        }

        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        #app { max-width: 600px; margin: 0 auto; position: relative; z-index: 10; }

        header {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6), 0 0 20px rgba(168,85,247,0.2);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        h1 { font-family: var(--font-display); font-size: 0.9rem; color: var(--accent); text-shadow: 0 0 8px rgba(168,85,247,0.8); margin: 0; }
        .subtitle { font-size: 1rem; color: var(--text-sub); margin-top: 4px; }
        .headerbtns { display: flex; gap: 8px; flex-wrap: wrap; }

        .themebtn {
            font-family: var(--font-display); font-size: 0.5rem;
            background: var(--accent-glow); border: 2px solid var(--accent);
            color: var(--accent); padding: 8px 10px; cursor: pointer;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        .panel {
            background: rgba(0,0,0,0.30);
            border: 2px solid var(--border-color);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6);
        }
        .panel h2 {
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--moon);
            margin-bottom: 14px;
            text-shadow: 0 0 6px rgba(255,225,77,0.4);
            display: flex; justify-content: space-between; gap: 8px; line-height: 1.5;
        }

        input[type=text], select {
            width: 100%; background: #070510; border: 2px solid var(--border-color);
            color: var(--text-main); padding: 10px; font-size: 1.25rem; font-family: var(--font-body);
            outline: none; margin-bottom: 10px;
        }
        input[type=text]:focus, select:focus { border-color: var(--accent); }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px; font-family: var(--font-display); font-size: 0.65rem;
            cursor: pointer; border: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
            text-transform: uppercase; text-align: center; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-ghost { background: transparent; border: 2px solid var(--accent); color: var(--text-main); }
        .btn-small { width: auto; padding: 8px 12px; font-size: 0.5rem; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chip {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.3); border: 1px dashed var(--border-color);
            padding: 6px 10px; font-size: 1.2rem;
        }
        .chip button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.2rem; }

        .role-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px dashed rgba(168, 85, 247, 0.18);
        }
        .role-row:last-child { border-bottom: none; }
        .role-info { font-size: 1.1rem; flex-grow: 1; padding-right: 10px; }
        .role-name { font-weight: 600; color: var(--text-main); }
        .role-desc { font-size: 0.95rem; color: var(--text-sub); line-height: 1.3; }

        .stepper { display: flex; align-items: center; gap: 8px; }
        .stepper button {
            width: 30px; height: 30px; background: var(--accent-glow);
            border: 2px solid var(--accent); color: #fff; cursor: pointer;
            font-family: var(--font-display); font-size: 0.6rem;
        }
        .stepper span { font-family: var(--font-display); font-size: 0.7rem; min-width: 22px; text-align: center; color: var(--moon); }

        .card-reveal {
            border: 2px dashed var(--accent);
            padding: 26px 18px; text-align: center; margin: 18px 0;
            background: var(--accent-glow);
            box-shadow: inset 0 0 26px rgba(168,85,247,0.15);
        }
        .role-badge {
            font-family: var(--font-display); font-size: 0.95rem;
            color: var(--moon); text-transform: uppercase; margin: 14px 0;
            letter-spacing: 0.04em; line-height: 1.5;
            text-shadow: 0 0 10px rgba(255,225,77,0.6);
        }

        .select-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .select-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.30); border: 2px solid var(--border-color);
            padding: 13px 14px; color: #fff; font-size: 1.1rem; cursor: pointer;
            transition: transform 0.1s steps(2), border-color 0.1s, background 0.1s;
        }
        .select-item:hover { transform: translateX(3px); border-color: var(--accent); }
        .select-item.selected { border-color: var(--moon); background: var(--accent-glow); box-shadow: 0 0 14px rgba(168,85,247,0.3); }
        .select-item.dead { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }

        .alive-summary { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
        .alive-pill {
            font-size: 1rem; padding: 5px 9px;
            background: rgba(0,0,0,0.30); border: 1px solid var(--border-color);
        }
        .alive-pill.dead { text-decoration: line-through; opacity: 0.30; }

        .codebox { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.2em; color: var(--moon); text-align: center; padding: 15px; background: #070510; border: 2px dashed var(--border-color); margin: 10px 0; }
        .linkbtn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; text-decoration: underline; display: block; margin: 10px auto; font-family: var(--font-body); }
        .center { text-align: center; }
        .dim { color: var(--text-sub); }
        .warn { color: #ff5555; font-size: 1rem; margin-top: 6px; }
        .inline2 { display: flex; gap: 8px; }

        .phase-subtitle { color: var(--text-sub); font-size: 1.15rem; margin-bottom: 12px; }

        .team-tag { display:inline-block; font-size:0.75rem; padding:2px 7px; margin-left:6px; border:1px solid var(--border-color); text-transform:uppercase; vertical-align: middle; }
        .team-village { color: var(--green); border-color: var(--green); }
        .team-loups { color: var(--red); border-color: var(--red); }
        .team-solo { color: var(--amber); border-color: var(--amber); }
        .rules-team-header { font-family: var(--font-display); font-size:0.7rem; color: var(--moon); margin: 22px 0 12px; text-shadow: 0 0 6px rgba(255,225,77,0.4); }
        .rules-team-header:first-child { margin-top: 0; }
        .mj-tag { display:inline-block; font-family: var(--font-display); font-size:0.5rem; color: var(--moon); border:1px solid var(--moon); padding:4px 7px; margin-left:8px; }
        .modechoice { text-align:left; }
        .subgroup-title { font-size: 0.9rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 4px; }
        .subgroup-title:first-child { margin-top: 0; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    const ROLES_DEF = {
        loup: { name: "Loup-Garou", team: "loups", icon: "🐺", desc: "Chaque nuit, les Loups-Garous se réveillent ensemble et dévorent un villageois de leur choix." },
        infect: { name: "Infect Père des Loups", team: "loups", icon: "🩸", desc: "Un Loup-Garou qui peut, une fois par partie, infecter sa victime au lieu de la tuer : elle devient loup à son tour." },
        loup_blanc: { name: "Loup Blanc", team: "solo", icon: "🐺⚪", desc: "Un loup solitaire qui joue pour lui seul. Une nuit sur deux, il peut dévorer un autre loup en plus de la victime commune." },
        corbeau: { name: "Le Corbeau", team: "village", icon: "🐦‍⬛", desc: "Chaque nuit, désigne un joueur qui recevra une voix de pénalité supplémentaire au vote du lendemain." },
        chevalier: { name: "Chevalier Rouillé", team: "village", icon: "🗡️", desc: "S'il est dévoré par les loups, sa rouille empoisonne l'un d'eux, qui mourra la nuit suivante." },
        joueur_flute: { name: "Joueur de Flûte", team: "solo", icon: "🪈", desc: "Chaque nuit, charme deux joueurs. Il gagne seul si tous les autres survivants finissent charmés." },
        voyante: { name: "Voyante", team: "village", icon: "🔮", desc: "Chaque nuit, découvre en secret le rôle exact d'un joueur de son choix." },
        sorciere: { name: "Sorcière", team: "village", icon: "🧪", desc: "Possède deux potions à usage unique : une de vie pour sauver la victime des loups, une de mort pour éliminer qui elle veut." },
        chasseur: { name: "Chasseur", team: "village", icon: "🏹", desc: "S'il meurt, de jour comme de nuit, il tire immédiatement une dernière balle sur un joueur de son choix." },
        garde: { name: "Garde", team: "village", icon: "🛡️", desc: "Chaque nuit, protège un joueur des attaques des loups." },
        petite_fille: { name: "Petite Fille", team: "village", icon: "👧", desc: "Peut espionner discrètement les loups pendant leur réveil, au risque de se faire repérer." },
        cupidon: { name: "Cupidon", team: "village", icon: "💘", desc: "La première nuit, unit deux joueurs par l'amour. Si l'un des deux meurt, l'autre meurt de chagrin." },
        ange: { name: "Ange", team: "solo", icon: "🪽", desc: "Gagne seul s'il parvient à se faire éliminer par le village dès le tout premier vote." },
        ancien: { name: "Ancien", team: "village", icon: "🧓", desc: "Résiste à la première attaque des loups. S'il est éliminé par le village en revanche, tous les villageois à pouvoir perdent leurs capacités." },
        idiot_du_village: { name: "Idiot du Village", team: "village", icon: "🤪", desc: "S'il est condamné par le village, son identité est révélée mais il survit — en perdant définitivement son droit de vote." },
        bouc_emissaire: { name: "Bouc Émissaire", team: "village", icon: "🐐", desc: "En cas d'égalité au vote du village, c'est lui qui est automatiquement désigné et éliminé, sans second tour." },
        voleur: { name: "Voleur", team: "village", icon: "🗝️", desc: "Avant la première nuit, découvre deux rôles supplémentaires mis de côté et peut échanger son rôle contre l'un d'eux." },
        servante_devouee: { name: "Servante Dévouée", team: "village", icon: "🙇", desc: "Une fois par partie, à la mort d'un joueur, peut sacrifier sa propre identité pour endosser secrètement le rôle du défunt." },
        villageois: { name: "Simple Villageois", team: "village", icon: "🧑‍🌾", desc: "Aucun pouvoir particulier, seulement sa voix et sa capacité à convaincre le village." }
    };
    const TEAM_LABELS = { village: "🏘️ Village", loups: "🐺 Loups-Garous", solo: "🎭 Rôles Solo" };
    const TEAM_ORDER = ["village", "loups", "solo"];

    var peer = null;
    var conn = null;
    var connections = [];
    var isHost = false;
    var myName = "";
    var roomCode = "";

    var state = {
        gameMode: null,
        networkSubMode: null,
        mjName: null,
        screen: "home",
        returnScreen: "home",
        players: ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4", "Joueur 5", "Joueur 6"],
        roleCounts: {
            loup: 1, infect: 0, loup_blanc: 0, corbeau: 0, chevalier: 0, joueur_flute: 0,
            voyante: 1, sorciere: 1, chasseur: 0,
            garde: 0, petite_fille: 0, cupidon: 0, ange: 0,
            ancien: 0, idiot_du_village: 0, bouc_emissaire: 0, voleur: 0, servante_devouee: 0
        },
        gamePlayers: [],
        nightNumber: 1,
        nightStep: 0,
        nightActions: {},
        witchPotions: { heal: true, death: true },
        witchSavedTemp: false,
        witchKillTemp: null,
        lovers: [],
        infectedPlayerId: null,
        corbeauTargetId: null,
        charmedPlayerIds: [],
        hunterPending: null,
        hunterPendingNext: null,
        dayDeaths: [],
        allDeaths: [],
        servanteUsed: false,
        villagePowersLost: false,
        thiefExtraCards: [],
        selectedTarget: null,
        voyanteRevealedTargetId: null,
        wolfVotes: {},
        villageVotes: {},
        tieMessage: "",
        firstDayVotePassed: false,
        winner: null
    };

    // ---------- Helpers ----------
    function isMJDevice() {
        if (state.gameMode === "local") return true;
        if (state.gameMode === "network" && state.networkSubMode === "manual") {
            return !!myName && !!state.mjName && myName.toLowerCase() === state.mjName.toLowerCase();
        }
        return false;
    }
    function directControlActive() { return state.gameMode === "local" || isMJDevice(); }
    function canLaunchNight() {
        if (state.gameMode !== "network") return false;
        if (state.networkSubMode === "auto") return isHost;
        if (state.networkSubMode === "manual") return isMJDevice();
        return false;
    }
    function getMyGamePlayer() {
        return state.gamePlayers.find(p => p.name.toLowerCase() === myName.toLowerCase());
    }
    function getPlayerPool() {
        if (state.gameMode === "network" && state.networkSubMode === "manual" && state.mjName) {
            return state.players.filter(p => p.toLowerCase() !== state.mjName.toLowerCase());
        }
        return state.players.slice();
    }

    function openRules() {
        state.returnScreen = state.screen;
        state.screen = "rules";
        render();
    }
    function closeRules() {
        state.screen = state.returnScreen || "home";
        render();
    }

    // ---------- Mode / connection setup ----------
    function selectMode(mode) {
        state.gameMode = mode;
        if (mode === "local") {
            state.screen = "setup";
            render();
        } else {
            state.screen = "net_host_or_join";
            render();
        }
    }

    function generateRoomCode() {
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        var code = "";
        for (var i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        return code;
    }

    function startHosting() {
        var nameInput = document.getElementById("pseudoHost");
        if (!nameInput || !nameInput.value.trim()) { alert("Entre ton pseudo d'hôte !"); return; }

        myName = nameInput.value.trim();
        isHost = true;
        roomCode = generateRoomCode();
        state.players = [myName];
        state.networkSubMode = "auto";
        state.mjName = null;

        if (peer) peer.destroy();
        peer = new Peer(roomCode);

        peer.on('open', function (id) {
            state.screen = "setup";
            render();
        });

        peer.on('connection', function (c) {
            connections.push(c);
            c.on('data', function (data) {
                if (data.type === "JOIN") {
                    if (!state.players.includes(data.name)) state.players.push(data.name);
                    broadcastState();
                    render();
                } else if (data.type === "ACTION") {
                    dispatchAction(data.name, data.payload);
                }
            });
        });
    }

    function broadcastState() {
        connections.forEach(function (c) { c.send({ type: "STATE_UPDATE", data: state }); });
    }

    function joinRoomForm() {
        isHost = false;
        state.screen = "join_form";
        render();
    }

    function connectToRoom() {
        var nameInput = document.getElementById("pseudoJoin");
        var codeInput = document.getElementById("roomCodeInput");
        if (!nameInput.value.trim() || !codeInput.value.trim()) { alert("Remplis tous les champs !"); return; }

        myName = nameInput.value.trim();
        roomCode = codeInput.value.trim().toUpperCase();

        if (peer) peer.destroy();
        peer = new Peer();

        peer.on('open', function (id) {
            conn = peer.connect(roomCode);

            conn.on('open', function () {
                conn.send({ type: "JOIN", name: myName });
                state.screen = "waiting_room";
                render();
            });

            conn.on('data', function (data) {
                if (data.type === "STATE_UPDATE") {
                    state = data.data;
                    render();
                }
            });
        });
    }

    function toggleFullscreen() {
        var isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFs) {
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
    document.addEventListener("fullscreenchange", function () { render(); });

    function shuffle(array) {
        let arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ---------- Setup screen actions ----------
    function addPlayer() {
        if (state.gameMode === "network") return;
        const input = document.getElementById("playerNameInput");
        const name = input ? input.value.trim() : "";
        if (!name) return;
        state.players.push(name);
        render();
    }

    function removePlayer(index) {
        if (state.gameMode === "network") return;
        state.players.splice(index, 1);
        render();
    }

    function updateRoleCount(roleKey, delta) {
        if (state.gameMode === "network" && !isHost) return;
        state.roleCounts[roleKey] = Math.max(0, (state.roleCounts[roleKey] || 0) + delta);
        if (state.gameMode === "network") broadcastState();
        render();
    }

    function getSpecialRolesTotal() {
        return Object.values(state.roleCounts).reduce((a, b) => a + b, 0);
    }

    function setSubMode(mode) {
        if (!isHost) return;
        state.networkSubMode = mode;
        if (mode === "auto") state.mjName = null;
        else if (!state.mjName) state.mjName = myName;
        broadcastState();
        render();
    }
    function setMjName(name) {
        if (!isHost) return;
        state.mjName = name;
        broadcastState();
        render();
    }

    function startDistribution() {
        if (state.gameMode === "network" && !isHost) return;
        const pool = getPlayerPool();
        const totalSpecial = getSpecialRolesTotal();
        if (pool.length < 4) {
            alert("Il faut au minimum 4 joueurs (hors Maître du Jeu) pour démarrer.");
            return;
        }
        if (totalSpecial > pool.length) {
            alert("Vous avez configuré plus de rôles spéciaux que de joueurs.");
            return;
        }

        let deck = [];
        for (const [role, count] of Object.entries(state.roleCounts)) {
            for (let i = 0; i < count; i++) deck.push(role);
        }
        while (deck.length < pool.length) deck.push("villageois");
        deck = shuffle(deck);

        state.thiefExtraCards = (state.roleCounts.voleur > 0) ? ["villageois", "villageois"] : [];

        state.gamePlayers = pool.map((name, index) => ({
            id: index, name: name, role: deck[index], alive: true,
            isLover: false, isInfected: false, canVote: true,
            ancienWounded: false, thiefResolved: false
        }));

        state.nightNumber = 1;
        state.nightStep = 0;
        state.nightActions = {};
        state.witchPotions = { heal: true, death: true };
        state.witchSavedTemp = false;
        state.witchKillTemp = null;
        state.lovers = [];
        state.infectedPlayerId = null;
        state.corbeauTargetId = null;
        state.charmedPlayerIds = [];
        state.hunterPending = null;
        state.hunterPendingNext = null;
        state.dayDeaths = [];
        state.allDeaths = [];
        state.servanteUsed = false;
        state.villagePowersLost = false;
        state.selectedTarget = null;
        state.voyanteRevealedTargetId = null;
        state.wolfVotes = {};
        state.villageVotes = {};
        state.tieMessage = "";
        state.firstDayVotePassed = false;
        state.winner = null;
        state.revealIndex = 0;
        state.revealed = false;

        state.screen = (state.gameMode === "local") ? "reveal" : "reveal_net";

        if (state.gameMode === "network") broadcastState();
        render();
    }

    // ---------- Night flow ----------
    function getNightSteps() {
        const steps = [];
        const hasAlive = (role) => state.gamePlayers.some(p => p.role === role && p.alive);
        const powersOk = !state.villagePowersLost;

        if (state.nightNumber === 1 && hasAlive("cupidon") && powersOk) steps.push("cupidon");
        if (hasAlive("garde") && powersOk) steps.push("garde");
        if (hasAlive("corbeau") && powersOk) steps.push("corbeau");
        if (hasAlive("voyante") && powersOk) steps.push("voyante");

        const wolvesAlive = state.gamePlayers.some(p => (p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected) && p.alive);
        if (wolvesAlive) steps.push("loups");

        if (hasAlive("infect") && !state.infectedPlayerId) steps.push("infect");
        if (hasAlive("loup_blanc") && state.nightNumber % 2 === 0) steps.push("loup_blanc");
        if (hasAlive("sorciere") && powersOk && (state.witchPotions.heal || state.witchPotions.death)) steps.push("sorciere");
        if (hasAlive("joueur_flute")) steps.push("joueur_flute");
        if (hasAlive("servante_devouee") && !state.servanteUsed && state.allDeaths.length > 0) steps.push("servante");

        return steps;
    }

    function afterHostMutation() {
        if (state.gameMode === "network") broadcastState();
        render();
    }

    function advanceNight() {
        const steps = getNightSteps();
        state.nightStep++;
        state.selectedTarget = null;
        state.wolfVotes = {};
        state.witchSavedTemp = false;
        state.witchKillTemp = null;
        state.voyanteRevealedTargetId = null;
        if (state.nightStep >= steps.length) {
            resolveNight();
        } else {
            afterHostMutation();
        }
    }

    function checkWolvesConsensus() {
        const aliveWolves = state.gamePlayers.filter(p => (p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected) && p.alive);
        const votes = Object.values(state.wolfVotes);

        if (votes.length >= aliveWolves.length && aliveWolves.length > 0) {
            let counts = {};
            votes.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
            let maxVotes = 0, candidates = [];
            for (let [t, c] of Object.entries(counts)) {
                if (c > maxVotes) { maxVotes = c; candidates = [parseInt(t)]; }
                else if (c === maxVotes) candidates.push(parseInt(t));
            }
            if (candidates.length > 1) {
                state.tieMessage = "Égalité entre les loups : le vote est annulé. Veuillez revoter.";
                state.wolfVotes = {};
                afterHostMutation();
                return;
            }
            state.tieMessage = "";
            state.nightActions.wolfVictim = candidates[0];
            advanceNight();
            return;
        }
        afterHostMutation();
    }

    function checkVillageConsensus() {
        const aliveVillagers = state.gamePlayers.filter(p => p.alive && p.canVote !== false);
        const votes = Object.values(state.villageVotes);

        if (votes.length >= aliveVillagers.length && aliveVillagers.length > 0) {
            let counts = {};
            votes.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
            if (state.corbeauTargetId !== null && counts[state.corbeauTargetId]) counts[state.corbeauTargetId] += 1;

            let maxVotes = 0, candidates = [];
            for (let [t, c] of Object.entries(counts)) {
                if (c > maxVotes) { maxVotes = c; candidates = [parseInt(t)]; }
                else if (c === maxVotes) candidates.push(parseInt(t));
            }

            if (candidates.length > 1) {
                const scapegoat = state.gamePlayers.find(p => p.alive && p.role === "bouc_emissaire");
                state.villageVotes = {};
                if (scapegoat) { condemnPlayer(scapegoat.id); return; }
                state.tieMessage = "Égalité parfaite au village ! Le vote doit être refait.";
                afterHostMutation();
                return;
            }

            state.tieMessage = "";
            state.villageVotes = {};
            condemnPlayer(candidates[0]);
            return;
        }
        afterHostMutation();
    }

    function condemnPlayer(id) {
        const condemned = state.gamePlayers.find(p => p.id === id);
        if (!condemned) return;

        if (!state.firstDayVotePassed && condemned.role === "ange") {
            state.winner = "Ange";
            state.screen = "end";
            afterHostMutation();
            return;
        }
        state.firstDayVotePassed = true;

        if (condemned.role === "idiot_du_village") {
            condemned.canVote = false;
            state.dayDeaths.push({ player: condemned, cause: "épargné (idiot du village)" });
        } else {
            killPlayer(condemned.id, "tribunal");
        }

        if (state.hunterPending) {
            state.hunterPendingNext = "night";
            state.screen = "hunter";
        } else if (!checkGameEnd()) {
            state.nightNumber++;
            state.nightStep = 0;
            state.nightActions = {};
            state.screen = "night";
        }
        afterHostMutation();
    }

    function resolveNight() {
        let deaths = [];
        const wolfVictimId = state.nightActions.wolfVictim;
        const protectedId = state.nightActions.protected;
        const witchKillId = state.nightActions.witchKill;
        const witchSave = state.nightActions.witchSaved;
        const whiteKillId = state.nightActions.whiteKill;
        const infectedId = state.nightActions.infected;

        state.corbeauTargetId = state.nightActions.corbeauTarget !== undefined ? state.nightActions.corbeauTarget : null;

        if (wolfVictimId !== undefined && wolfVictimId !== null) {
            if (wolfVictimId !== protectedId && !witchSave) {
                const victim = state.gamePlayers.find(p => p.id === wolfVictimId);
                if (victim && victim.role === "chevalier") {
                    const aliveWolves = state.gamePlayers.filter(p => (p.role === "loup" || p.role === "infect") && p.alive);
                    if (aliveWolves.length > 0) deaths.push(aliveWolves[0].id);
                }
                if (infectedId === wolfVictimId) {
                    if (victim) { victim.isInfected = true; state.infectedPlayerId = victim.id; }
                } else if (victim && victim.role === "ancien" && !victim.ancienWounded) {
                    victim.ancienWounded = true;
                } else {
                    deaths.push(wolfVictimId);
                }
            }
        }

        if (whiteKillId !== undefined && whiteKillId !== null) {
            if (!deaths.includes(whiteKillId) && whiteKillId !== protectedId) deaths.push(whiteKillId);
        }

        if (witchKillId !== undefined && witchKillId !== null) {
            if (!deaths.includes(witchKillId)) deaths.push(witchKillId);
        }

        state.dayDeaths = [];
        deaths.forEach(id => killPlayer(id, "nuit"));

        const alive = state.gamePlayers.filter(p => p.alive);
        const flutist = alive.find(p => p.role === "joueur_flute");
        if (flutist) {
            const others = alive.filter(p => p.id !== flutist.id);
            if (others.length === 0 || others.every(p => state.charmedPlayerIds.includes(p.id))) {
                state.winner = "Joueur de Flûte";
                state.screen = "end";
                afterHostMutation();
                return;
            }
        }

        state.screen = "day";
        checkGameEnd();
        afterHostMutation();
    }

    function killPlayer(id, cause) {
        const p = state.gamePlayers.find(pl => pl.id === id);
        if (!p || !p.alive) return;
        p.alive = false;
        state.dayDeaths.push({ player: p, cause: cause });
        state.allDeaths.push({ id: p.id, name: p.name, role: p.role, cause: cause });

        if (cause === "tribunal" && p.role === "ancien") state.villagePowersLost = true;

        if (p.isLover) {
            const otherLover = state.gamePlayers.find(pl => pl.isLover && pl.id !== p.id && pl.alive);
            if (otherLover) {
                otherLover.alive = false;
                state.dayDeaths.push({ player: otherLover, cause: "chagrin" });
                state.allDeaths.push({ id: otherLover.id, name: otherLover.name, role: otherLover.role, cause: "chagrin" });
                if (otherLover.role === "chasseur") state.hunterPending = otherLover;
            }
        }

        if (p.role === "chasseur") state.hunterPending = p;
    }

    function checkGameEnd() {
        const alive = state.gamePlayers.filter(p => p.alive);
        const wolves = alive.filter(p => p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected);
        const villagers = alive.filter(p => !wolves.includes(p));

        if (alive.length === 2 && alive[0].isLover && alive[1].isLover) {
            state.winner = "Amoureux"; state.screen = "end"; return true;
        }
        if (wolves.length === 0) { state.winner = "Village"; state.screen = "end"; return true; }
        if (wolves.length >= villagers.length) {
            if (wolves.length === 1 && wolves[0].role === "loup_blanc" && villagers.length === 0) state.winner = "Loup Blanc";
            else state.winner = "Loups-Garous";
            state.screen = "end";
            return true;
        }
        return false;
    }

    // ---------- Networked action dispatch ----------
    const ACTION_HANDLERS = {
        LAUNCH_NIGHT() { state.screen = "night"; afterHostMutation(); },
        CUPIDON(p) {
            state.gamePlayers.forEach(gp => gp.isLover = p.lovers.includes(gp.id));
            state.lovers = p.lovers;
            advanceNight();
        },
        GARDE(p) { state.nightActions.protected = p.targetId; advanceNight(); },
        CORBEAU(p) { state.nightActions.corbeauTarget = p.targetId; advanceNight(); },
        VOYANTE_PEEK(p) { state.voyanteRevealedTargetId = p.targetId; afterHostMutation(); },
        VOYANTE_CONTINUE() { advanceNight(); },
        WOLVES_DIRECT(p) { state.nightActions.wolfVictim = p.targetId; advanceNight(); },
        WOLVES_VOTE(p) { state.wolfVotes[p.playerId] = p.targetId; checkWolvesConsensus(); },
        INFECT_CHOOSE(p) { if (p.infect) state.nightActions.infected = state.nightActions.wolfVictim; advanceNight(); },
        LOUP_BLANC_CHOOSE(p) { if (p.targetId !== null) state.nightActions.whiteKill = p.targetId; advanceNight(); },
        SORCIERE_SAVE() {
            if (state.witchPotions.heal) {
                state.witchSavedTemp = !state.witchSavedTemp;
                afterHostMutation();
            }
        },
        SORCIERE_CANCEL_SAVE() {
            state.witchSavedTemp = false;
            afterHostMutation();
        },
        SORCIERE_CANCEL_KILL() {
            state.witchKillTemp = null;
            state.selectedTarget = null;
            afterHostMutation();
        },
        SORCIERE_PASS() {
            state.witchSavedTemp = false;
            state.witchKillTemp = null;
            state.selectedTarget = null;
            state.nightActions.witchSaved = false;
            state.nightActions.witchKill = null;
            advanceNight();
        },
        SORCIERE_FINISH(p) {
            const killTargetId = state.witchKillTemp !== null ? state.witchKillTemp : p.killTargetId;
            if (state.witchSavedTemp && state.witchPotions.heal) {
                state.nightActions.witchSaved = true;
                state.witchPotions.heal = false;
            } else {
                state.nightActions.witchSaved = false;
            }
            if (killTargetId !== null && state.witchPotions.death) {
                state.nightActions.witchKill = killTargetId;
                state.witchPotions.death = false;
            } else {
                state.nightActions.witchKill = null;
            }
            state.witchSavedTemp = false;
            state.witchKillTemp = null;
            advanceNight();
        },
        FLUTE_CHOOSE(p) {
            (p.charmedIds || []).forEach(id => { if (!state.charmedPlayerIds.includes(id)) state.charmedPlayerIds.push(id); });
            advanceNight();
        },
        SERVANTE_CHOOSE(p) {
            if (p.deadPlayerId !== null) {
                const dead = state.allDeaths.find(d => d.id === p.deadPlayerId);
                const me = state.gamePlayers.find(gp => gp.role === "servante_devouee" && gp.alive);
                if (dead && me) me.role = dead.role;
            }
            state.servanteUsed = true;
            advanceNight();
        },
        THIEF_SWAP(p) {
            const pl = state.gamePlayers.find(gp => gp.id === p.playerId);
            if (!pl) return;
            if (p.cardIndex !== null && p.cardIndex !== undefined) {
                const newRole = state.thiefExtraCards[p.cardIndex];
                state.thiefExtraCards[p.cardIndex] = pl.role;
                pl.role = newRole;
            }
            pl.thiefResolved = true;
            afterHostMutation();
        },
        VILLAGE_DIRECT(p) { condemnPlayer(p.targetId); },
        VILLAGE_VOTE(p) { state.villageVotes[p.playerId] = p.targetId; checkVillageConsensus(); },
        ADVANCE_TO_VOTE() {
            if (state.hunterPending) { state.hunterPendingNext = "vote"; state.screen = "hunter"; }
            else { state.screen = "vote"; }
            state.selectedTarget = null;
            afterHostMutation();
        },
        HUNTER_SHOT(p) {
            const target = state.gamePlayers.find(gp => gp.id === p.targetId);
            state.hunterPending = null;
            if (target) killPlayer(target.id, "balle de chasseur");
            if (state.hunterPending) { afterHostMutation(); return; }
            if (!checkGameEnd()) {
                if (state.hunterPendingNext === "vote") { state.screen = "vote"; state.selectedTarget = null; }
                else { state.nightNumber++; state.nightStep = 0; state.nightActions = {}; state.screen = "night"; }
            }
            afterHostMutation();
        }
    };

    function dispatchAction(name, payload) {
        const handler = ACTION_HANDLERS[name];
        if (handler) handler(payload || {});
    }

    function runAction(name, payload) {
        if (state.gameMode === "local" || isHost) {
            dispatchAction(name, payload);
        } else {
            if (conn) conn.send({ type: "ACTION", name: name, payload: payload });
            state.screen = "waiting_vote";
            render();
        }
    }

    function newGame() {
        state.screen = "setup";
        state.gamePlayers = [];
        if (state.gameMode === "network") broadcastState();
        render();
    }

        else if (state.screen === "waiting_vote") {
            const aliveCount = state.gamePlayers.filter(p => p.alive).length;

            html += '<h1>⏳ Action envoyée</h1><div class="panel center" style="padding:40px 20px;"><h2>C\'est enregistré !</h2>';

                ((!disableControls && state.gameMode !== "network" && state.players.length > 1) ? '<button onclick="removePlayer(' + i + ')">✕</button>' : '') +
                '</div>';
        }).join("");

        let rolesHtml = "";
        TEAM_ORDER.forEach(team => {

                rolesHtml += '</div></div>';

        });

        let html = "";
        html += '<div class="panel"><h2>Joueurs inscrits (' + state.players.length + ')</h2><div class="chips">' + chipsHtml + '</div>';

        html += '<div class="panel"><h2>Rôles &amp; Composition (' + totalSpecial + ' spéciaux + ' + simpleVillagers + ' villageois)</h2>' + rolesHtml + '</div>';
        if (state.roleCounts.voleur > 0) {
            html += '<p class="dim" style="margin:-8px 0 12px;">🗝️ Le Voleur ajoutera 2 cartes Villageois supplémentaires mises de côté.</p>';
        }

        if (!disableControls) {
            const mjMissing = state.gameMode === "network" && state.networkSubMode === "manual" && !state.mjName;
            html += '<button class="btn btn-primary" ' + (mjMissing ? "disabled" : "") + ' onclick="startDistribution()">Distribuer les rôles ›</button>';
        } else {
            html += '<p class="center dim" style="margin-top:15px;">En attente que l\'hôte lance la partie...</p>';
        }
        return html;
    }

    // ---------- Reveal ----------
    function renderThiefChoice(p, onSwap, onKeep) {
        let html = '<div class="panel" style="margin-top:14px;"><h2>🗝️ Vous êtes le Voleur</h2>';
        html += '<p class="dim" style="margin-bottom:10px;">Deux cartes ont été mises de côté. Vous pouvez en prendre une à la place de votre rôle actuel :</p>';
        html += '<div class="select-list">';
        state.thiefExtraCards.forEach((r, i) => {
            html += '<div class="select-item" onclick="' + onSwap + '(' + i + ')"><span>' + ROLES_DEF[r].icon + ' ' + ROLES_DEF[r].name + '</span></div>';
        });
        html += '</div>';
        html += '<button class="btn btn-ghost" onclick="' + onKeep + '()">Garder mon rôle actuel</button></div>';
        return html;
    }

    function renderRevealLocal() {
        const p = state.gamePlayers[state.revealIndex];
        const role = ROLES_DEF[p.role];

        if (!state.revealed) {
            return '<h1>Transmission du rôle</h1>' +
                '<p class="phase-subtitle">Joueur ' + (state.revealIndex + 1) + ' / ' + state.gamePlayers.length + '</p>' +
                '<div class="card-reveal"><p style="color:var(--text-sub);">Donnez le téléphone à</p>' +
                '<h2 style="font-size:1.4rem; margin:10px 0; color:var(--text-main);">' + p.name + '</h2>' +
                '<button class="btn btn-primary" style="margin-top:16px;" onclick="state.revealed=true; render();">👁️ Révéler mon rôle</button></div>';
        }

        let html = '<h1>Votre Rôle Secret</h1><p class="phase-subtitle">' + p.name + '</p>';
        html += '<div class="card-reveal"><div style="font-size:3rem;">' + role.icon + '</div>';
        html += '<div class="role-badge">' + role.name + '</div>';
        html += '<p style="font-size:1.1rem; color:var(--text-sub); line-height:1.4;">' + role.desc + '</p></div>';

        if (p.role === "voleur" && !p.thiefResolved && state.thiefExtraCards.length === 2) {
            html += renderThiefChoice(p, "thiefSwapLocal", "thiefKeepLocal");
        } else {
            html += '<button class="btn btn-ghost" onclick="advanceRevealLocal()">Cacher et passer au joueur suivant ›</button>';
        }
        return html;
    }

    function thiefSwapLocal(idx) {
        const p = state.gamePlayers[state.revealIndex];
        runAction("THIEF_SWAP", { playerId: p.id, cardIndex: idx });
    }
    function thiefKeepLocal() {
        const p = state.gamePlayers[state.revealIndex];
        runAction("THIEF_SWAP", { playerId: p.id, cardIndex: null });
    }
    function advanceRevealLocal() {
        if (state.revealIndex + 1 < state.gamePlayers.length) {
            state.revealIndex++; state.revealed = false; render();
        } else {
            state.screen = "night"; render();
        }
    }

    function renderRevealNet() {
        const p = getMyGamePlayer();
        const rDef = p ? ROLES_DEF[p.role] : { name: "?", icon: "❓", desc: "" };

        let html = '<h1>Votre Rôle Secret</h1>';
        html += '<div class="card-reveal"><div style="font-size:3rem;">' + rDef.icon + '</div>';
        html += '<div class="role-badge">' + rDef.name + '</div>';
        html += '<p style="font-size:1.1rem; color:var(--text-sub); line-height:1.4;">' + rDef.desc + '</p></div>';

        if (p && p.role === "voleur" && !p.thiefResolved && state.thiefExtraCards.length === 2) {
            html += renderThiefChoice(p, "thiefSwapNet", "thiefKeepNet");
        } else if (canLaunchNight()) {
            html += '<button class="btn btn-primary" onclick="runAction(\'LAUNCH_NIGHT\', {})">Lancer la première nuit ›</button>';
        } else {
            html += '<p class="center dim">En attente du lancement de la première nuit...</p>';
        }
        return html;
    }

    function thiefSwapNet(idx) {
        const p = getMyGamePlayer();
        runAction("THIEF_SWAP", { playerId: p.id, cardIndex: idx });
    }
    function thiefKeepNet() {
        const p = getMyGamePlayer();
        runAction("THIEF_SWAP", { playerId: p.id, cardIndex: null });
    }

    function renderMjReady() {
        return '<h1>🎙️ Maître du Jeu</h1><div class="panel center">' +
            '<p>Les rôles ont été distribués en secret à chaque joueur.</p>' +
            '<p class="dim" style="margin-top:10px;">Vous allez piloter les nuits et les votes depuis cet appareil. Les joueurs ne verront les résultats qu\'au petit matin.</p>' +
            '<button class="btn btn-primary" style="margin-top:16px;" onclick="runAction(\'LAUNCH_NIGHT\', {})">Lancer la première nuit ›</button></div>';
    }

    // ---------- Night screens ----------
    function renderNightRestricted() {
        return '<h1>🌙 Nuit ' + state.nightNumber + '</h1>' +
            '<div class="panel center" style="padding:40px 20px;"><div style="font-size:3rem;">🤫</div>' +
            '<h2>Le Maître du Jeu s\'occupe de tout</h2>' +
            '<p class="dim" style="margin-top:10px;">Fermez les yeux, vous découvrirez les évènements de la nuit au petit matin.</p></div>';
    }

    function renderNight() {
        const steps = getNightSteps();
        const currentStep = steps[state.nightStep];
        const alivePlayers = state.gamePlayers.filter(p => p.alive);
        const myPlayer = state.gameMode === "network" ? getMyGamePlayer() : null;

        let isMyTurn = directControlActive();
        if (!isMyTurn && state.gameMode === "network" && state.networkSubMode === "auto") {
            if (currentStep === "cupidon" && myPlayer && myPlayer.role === "cupidon" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "garde" && myPlayer && myPlayer.role === "garde" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "corbeau" && myPlayer && myPlayer.role === "corbeau" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "voyante" && myPlayer && myPlayer.role === "voyante" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "loups" && myPlayer && (myPlayer.role === "loup" || myPlayer.role === "infect" || myPlayer.role === "loup_blanc" || myPlayer.isInfected) && myPlayer.alive) isMyTurn = true;
            if (currentStep === "infect" && myPlayer && myPlayer.role === "infect" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "loup_blanc" && myPlayer && myPlayer.role === "loup_blanc" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "sorciere" && myPlayer && myPlayer.role === "sorciere" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "joueur_flute" && myPlayer && myPlayer.role === "joueur_flute" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "servante" && myPlayer && myPlayer.role === "servante_devouee" && myPlayer.alive) isMyTurn = true;
        }

        if (!isMyTurn && state.gameMode === "network") {
            return '<h1>🌙 Nuit ' + state.nightNumber + '</h1>' +
                '<div class="panel center" style="padding:40px 20px;"><div style="font-size: 3rem; margin-bottom: 15px;">💤</div>' +
                '<h2>Fermez les yeux...</h2><p class="dim" style="margin-top: 10px;">Ce n\'est pas votre tour ou vous dormez.</p></div>';
        }

        let contentHtml = "";

        if (currentStep === "cupidon") {
            contentHtml = '<h2>💘 Cupidon</h2><p class="phase-subtitle">Choisissez deux amoureux.</p><div class="select-list">' +
                alivePlayers.map(p => '<div class="select-item ' + (state.lovers.includes(p.id) ? "selected" : "") + '" onclick="toggleLover(' + p.id + ')"><span>' + p.name + '</span><span>' + (state.lovers.includes(p.id) ? "❤️" : "") + '</span></div>').join("") +
                '</div><button class="btn btn-primary" ' + (state.lovers.length === 2 ? "" : "disabled") + ' onclick="runAction(\'CUPIDON\', {lovers: state.lovers})">Valider ›</button>';
        } else if (currentStep === "garde") {
            contentHtml = '<h2>🛡️ Le Garde</h2><p class="phase-subtitle">Protégez un joueur.</p>' + renderTargetList(alivePlayers) +
                '<button class="btn btn-primary" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'GARDE\', {targetId: state.selectedTarget})">Protéger ›</button>';
        } else if (currentStep === "corbeau") {
            contentHtml = '<h2>🐦‍⬛ Le Corbeau</h2><p class="phase-subtitle">Maudissez un joueur.</p>' + renderTargetList(alivePlayers) +
                '<button class="btn btn-primary" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'CORBEAU\', {targetId: state.selectedTarget})">Maudire ›</button>';
        } else if (currentStep === "voyante") {
            const targetObj = state.gamePlayers.find(p => p.id === state.voyanteRevealedTargetId);
            if (state.voyanteRevealedTargetId !== null && targetObj) {
                contentHtml = '<h2>🔮 La Voyante</h2><div class="card-reveal" style="margin:10px 0;"><p style="color:var(--text-sub);">Identité de ' + targetObj.name + ' :</p>' +
                    '<div class="role-badge">' + ROLES_DEF[targetObj.role].icon + ' ' + ROLES_DEF[targetObj.role].name + '</div></div>' +
                    '<button class="btn btn-primary" onclick="runAction(\'VOYANTE_CONTINUE\', {})">J\'ai vu, continuer ›</button>';
            } else {
                contentHtml = '<h2>🔮 La Voyante</h2><p class="phase-subtitle">Découvrez le rôle d\'un unique joueur.</p>' + renderTargetList(alivePlayers) +
                    '<button class="btn btn-primary" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'VOYANTE_PEEK\', {targetId: state.selectedTarget})">Voir son rôle ›</button>';
            }
        } else if (currentStep === "loups") {
            contentHtml = '<h2>🐺 Les Loups-Garous</h2><p class="phase-subtitle">Désignez une victime commune.</p>' +
                (state.tieMessage ? '<p style="color:var(--amber); text-align:center; font-weight:bold;">' + state.tieMessage + '</p>' : "") +
                renderTargetList(alivePlayers) +
                '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="submitWolfChoice()">Voter cette victime ›</button>';
        } else if (currentStep === "infect") {
            contentHtml = '<h2>🩸 Infect Père des Loups</h2><p class="phase-subtitle">Voulez-vous infecter la victime ?</p>' +
                '<div style="display:flex; gap:10px; margin-top:20px;">' +
                '<button class="btn btn-danger" onclick="runAction(\'INFECT_CHOOSE\', {infect: true})">Infecter</button>' +
                '<button class="btn btn-ghost" onclick="runAction(\'INFECT_CHOOSE\', {infect: false})">Ne pas infecter</button></div>';
        } else if (currentStep === "loup_blanc") {
            const wolfTargets = alivePlayers.filter(p => p.role === "loup" || p.role === "infect" || p.isInfected);
            contentHtml = '<h2>🐺⚪ Loup Blanc</h2><p class="phase-subtitle">Éliminer un autre loup ?</p>' + renderTargetList(wolfTargets) +
                '<div style="display:flex; gap:10px;">' +
                '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'LOUP_BLANC_CHOOSE\', {targetId: state.selectedTarget})">Tuer</button>' +
                '<button class="btn btn-ghost" onclick="runAction(\'LOUP_BLANC_CHOOSE\', {targetId: null})">Passer</button></div>';
        } else if (currentStep === "sorciere") {
            const victim = state.gamePlayers.find(p => p.id === state.nightActions.wolfVictim);
            const selectedKill = state.witchKillTemp !== null ? state.witchKillTemp : state.selectedTarget;
            contentHtml = '<h2>🧪 La Sorcière</h2><p class="phase-subtitle">Victime des loups : <strong>' + (victim ? victim.name : "Personne") + '</strong></p>';

            if (state.witchPotions.heal && victim && !state.witchSavedTemp) {
                contentHtml += '<button class="btn" style="background: var(--green); color: #06210f; margin-bottom:20px;" onclick="runAction(\'SORCIERE_SAVE\', {})">💚 Potion de vie</button>';
            } else if (state.witchPotions.heal && victim && state.witchSavedTemp) {
                contentHtml += '<button class="btn btn-ghost" style="margin-bottom:20px;" onclick="runAction(\'SORCIERE_CANCEL_SAVE\', {})">↩️ Annuler la potion de vie</button>';
            }

            if (state.witchPotions.death) {
                contentHtml += '<div class="select-list"><p style="font-size:1rem; color:var(--text-sub);">Potion de mort :</p>' +
                    alivePlayers.map(p => '<div class="select-item ' + (selectedKill === p.id ? "selected" : "") + '" onclick="state.witchKillTemp=' + p.id + '; state.selectedTarget=' + p.id + '; render();"><span>' + p.name + '</span></div>').join("") +
                    '</div>';
                if (selectedKill !== null) {
                    contentHtml += '<button class="btn btn-ghost" onclick="runAction(\'SORCIERE_CANCEL_KILL\', {})">↩️ Annuler le choix de la potion de mort</button>';
                }
            }
            contentHtml += '<div style="display:flex; gap:10px; margin-top:16px;">' +
                '<button class="btn btn-primary" style="flex:1;" onclick="runAction(\'SORCIERE_FINISH\', {killTargetId: state.witchKillTemp !== null ? state.witchKillTemp : null})">Valider les choix ›</button>' +
                '<button class="btn btn-ghost" style="flex:1;" onclick="runAction(\'SORCIERE_PASS\', {})">Passer le tour ›</button>' +
                '</div>';
        } else if (currentStep === "joueur_flute") {
            contentHtml = '<h2>🪈 Joueur de Flûte</h2><p class="phase-subtitle">Charmer 2 joueurs :</p><div class="select-list">' +
                alivePlayers.map(p => '<div class="select-item ' + ((state.nightActions.charmedTemp || []).includes(p.id) ? "selected" : "") + '" onclick="toggleCharm(' + p.id + ')"><span>' + p.name + '</span><span>' + ((state.charmedPlayerIds.includes(p.id) || (state.nightActions.charmedTemp || []).includes(p.id)) ? "🎶" : "") + '</span></div>').join("") +
                '</div><button class="btn btn-primary" onclick="runAction(\'FLUTE_CHOOSE\', {charmedIds: state.nightActions.charmedTemp || []})">Valider ›</button>';
        } else if (currentStep === "servante") {
            const deadList = state.allDeaths;
            contentHtml = '<h2>🙇 Servante Dévouée</h2><p class="phase-subtitle">Voulez-vous endosser le rôle d\'un défunt ?</p><div class="select-list">' +
                deadList.map(d => '<div class="select-item ' + (state.selectedTarget === d.id ? "selected" : "") + '" onclick="state.selectedTarget=' + d.id + '; render();"><span>' + d.name + '</span><span>' + ROLES_DEF[d.role].icon + ' ' + ROLES_DEF[d.role].name + '</span></div>').join("") +
                '</div><div style="display:flex; gap:10px;">' +
                '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'SERVANTE_CHOOSE\', {deadPlayerId: state.selectedTarget})">Prendre ce rôle</button>' +
                '<button class="btn btn-ghost" onclick="runAction(\'SERVANTE_CHOOSE\', {deadPlayerId: null})">Rester soi-même</button></div>';
        }

        return '<h1>🌙 Nuit ' + state.nightNumber + '</h1><div class="panel">' + contentHtml + '</div>';
    }

    function renderTargetList(players) {
        return '<div class="select-list">' + players.map(p =>
            '<div class="select-item ' + (state.selectedTarget === p.id ? "selected" : "") + '" onclick="state.selectedTarget=' + p.id + '; render();"><span>' + p.name + '</span></div>'
        ).join("") + '</div>';
    }
    function toggleLover(id) {
        if (state.lovers.includes(id)) state.lovers = state.lovers.filter(x => x !== id);
        else if (state.lovers.length < 2) state.lovers.push(id);
        render();
    }
    function toggleCharm(id) {
        if (!state.nightActions.charmedTemp) state.nightActions.charmedTemp = [];
        if (state.nightActions.charmedTemp.includes(id)) state.nightActions.charmedTemp = state.nightActions.charmedTemp.filter(x => x !== id);
        else if (state.nightActions.charmedTemp.length < 2) state.nightActions.charmedTemp.push(id);
        render();
    }
    function submitWolfChoice() {
        if (directControlActive()) {
            runAction("WOLVES_DIRECT", { targetId: state.selectedTarget });
        } else {
            const me = getMyGamePlayer();
            runAction("WOLVES_VOTE", { playerId: me.id, targetId: state.selectedTarget });
        }
    }

    // ---------- Day / Vote / Hunter / End ----------
    function renderDay(restricted) {
        let summaryDeaths = "";
        if (state.dayDeaths.length === 0) {
            summaryDeaths = "<p style='color:var(--green); font-weight:bold; margin:14px 0; text-align:center;'>Personne n'est mort cette nuit ! 🎉</p>";
        } else {
            summaryDeaths = '<div style="margin:14px 0;"><p style="color:var(--red); font-weight:bold; margin-bottom:8px;">Victimes de la nuit :</p>' +
                state.dayDeaths.map(d => '<div class="select-item dead" style="margin-bottom:6px;"><span>' + d.player.name + ' (' + ROLES_DEF[d.player.role].name + ')</span>' +
                    '<span style="font-size:0.9rem; text-transform:uppercase; color:var(--red);">' + d.cause + '</span></div>').join("") + '</div>';
        }

        const aliveHtml = state.gamePlayers.map(p => '<div class="alive-pill ' + (p.alive ? "" : "dead") + '">' + p.name + '</div>').join("");

        let html = '<h1>☀️ Village de Jour</h1><p class="phase-subtitle">Cycle du Jour ' + state.nightNumber + '</p>' +
            '<div class="panel">' + summaryDeaths + '<div class="alive-summary">' + aliveHtml + '</div></div>';

        const canAdvance = state.gameMode === "local" || isMJDevice() || (state.gameMode === "network" && state.networkSubMode === "auto" && isHost);
        if (!restricted) {
            if (canAdvance) {
                html += '<button class="btn btn-primary" onclick="runAction(\'ADVANCE_TO_VOTE\', {})">Passer au vote du village ›</button>';
            } else {
                html += '<p class="center dim" style="margin-top:10px;">En attente que l\'hôte lance le vote...</p>';
            }
        }
        return html;
    }

    function renderVoteRestricted() {
        return '<h1>⚖️ Vote du Village</h1><div class="panel center" style="padding:40px 20px;"><div style="font-size:3rem;">🗳️</div>' +
            '<h2>Le village délibère...</h2><p class="dim" style="margin-top:10px;">Le vote se déroule à l\'oral, le Maître du Jeu enregistre le verdict.</p></div>';
    }

    function renderVote() {
        const alive = state.gamePlayers.filter(p => p.alive);

        if (directControlActive()) {
            return '<h1>⚖️ Vote du Village</h1><p class="phase-subtitle">Désignez le joueur condamné par le village.</p>' +
                renderTargetList(alive) +
                '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'VILLAGE_DIRECT\', {targetId: state.selectedTarget})">Condamner ce joueur ›</button>';
        }

        const me = getMyGamePlayer();
        if (me && me.canVote === false) {
            return '<h1>⚖️ Vote du Village</h1><div class="panel center" style="padding:30px 20px;"><p>Vous avez perdu votre droit de vote.</p></div>';
        }

        return '<h1>⚖️ Vote du Village</h1><p class="phase-subtitle">Désignez l\'accusé au bûcher (Égalité = vote refait, sauf Bouc Émissaire).</p>' +
            (state.tieMessage ? '<p style="color:var(--amber); text-align:center; font-weight:bold;">' + state.tieMessage + '</p>' : "") +
            '<div class="select-list">' + alive.map(p =>
                '<div class="select-item ' + (state.selectedTarget === p.id ? "selected" : "") + '" onclick="state.selectedTarget=' + p.id + '; render();"><span>' + p.name + '</span><span>' + (state.selectedTarget === p.id ? "🔥 Accusé" : "") + '</span></div>'
            ).join("") + '</div>' +
            '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="submitVillageVote()">Voter contre ce joueur ›</button>';
    }
    function submitVillageVote() {
        const me = getMyGamePlayer();
        runAction("VILLAGE_VOTE", { playerId: me.id, targetId: state.selectedTarget });
    }

    function renderHunterRestricted() {
        return '<h1>🏹 Dernier Tir</h1><div class="panel center" style="padding:40px 20px;"><div style="font-size:3rem;">🎯</div>' +
            '<h2>Le Chasseur vise...</h2><p class="dim" style="margin-top:10px;">Patientez, un coup de feu va retentir.</p></div>';
    }

    function renderHunter() {
        const alive = state.gamePlayers.filter(p => p.alive);
        const me = getMyGamePlayer();
        const isMyTurn = directControlActive() || (me && state.hunterPending && me.id === state.hunterPending.id);

        if (!isMyTurn && state.gameMode === "network") return renderHunterRestricted();

        return '<h1>🏹 Dernier Tir du Chasseur</h1>' + renderTargetList(alive) +
            '<button class="btn btn-danger" ' + (state.selectedTarget !== null ? "" : "disabled") + ' onclick="runAction(\'HUNTER_SHOT\', {targetId: state.selectedTarget})">Tirer ›</button>';
    }

    function renderEnd() {
        return '<h1>🏆 Fin de Partie</h1><div class="card-reveal" style="margin:20px 0;"><div style="font-size:3rem;">🎉</div>' +
            '<div class="role-badge">' + state.winner + ' l\'emporte !</div></div>' +
            ((state.gameMode === "local" || isHost) ? '<button class="btn btn-primary" onclick="newGame()">Nouvelle partie ⟳</button>' : '<p class="center dim">En attente d\'une nouvelle partie...</p>');
    }

    render();
</script>
</body>
</html>
