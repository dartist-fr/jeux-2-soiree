<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0713">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Loup-Garou — Salle d'Arcade (Multijoueur Corrigé)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0713;
            --bg-panel: #16102b;
            --card-bg: #16102b;
            --grid-line: rgba(124, 58, 237, 0.10);
            --border-color: rgba(168, 85, 247, 0.35);
            --text-main: #f3e9ff;
            --text-sub: #a794c9;
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --moon: #ffe14d;
            --red: #ff3b5c;
            --green: #4dffa6;
            --amber: #ffb14d;
            --font-display: 'Press Start 2P', monospace;
            --font-body: 'VT323', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { background: var(--bg-color); }
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
                radial-gradient(circle at 50% -5%, rgba(255, 225, 77, 0.16) 0%, transparent 42%),
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.18) 0%, transparent 60%);
            background-size: 38px 38px, 38px 38px, 100% 100%, 100% 100%;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px;
            position: relative;
            overflow-x: hidden;
            font-size: 1.15rem;
        }

        body::after {
            content: "";
            position: fixed; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
            z-index: 100; mix-blend-mode: multiply;
        }

        #app { max-width: 600px; margin: 0 auto; position: relative; z-index: 10; }

        header {
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6), 0 0 20px rgba(168,85,247,0.2);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        h1 { font-family: var(--font-display); font-size: 0.9rem; color: var(--accent); text-shadow: 0 0 8px rgba(168,85,247,0.8); margin: 0; }
        .subtitle { font-size: 1rem; color: var(--text-sub); margin-top: 4px; }
        .headerbtns { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .themebtn {
            font-family: var(--font-display); font-size: 0.5rem;
            background: var(--accent-glow); border: 2px solid var(--accent);
            color: var(--accent); padding: 8px 10px; cursor: pointer;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
        }

        .panel {
            background: rgba(0,0,0,0.30);
            border: 2px solid var(--border-color);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 0 0 4px var(--bg-color), 6px 6px 0 rgba(0,0,0,0.6);
        }
        .panel h2 {
            font-family: var(--font-display);
            font-size: 0.75rem;
            color: var(--moon);
            margin-bottom: 14px;
            text-shadow: 0 0 6px rgba(255,225,77,0.4);
            display: flex; justify-content: space-between; gap: 8px; line-height: 1.5;
        }

        input[type=text], select {
            width: 100%; background: #070510; border: 2px solid var(--border-color);
            color: var(--text-main); padding: 10px; font-size: 1.25rem; font-family: var(--font-body);
            outline: none; margin-bottom: 10px;
        }
        input[type=text]:focus, select:focus { border-color: var(--accent); }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 14px; font-family: var(--font-display); font-size: 0.65rem;
            cursor: pointer; border: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
            text-transform: uppercase; text-align: center; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-ghost { background: transparent; border: 2px solid var(--accent); color: var(--text-main); }
        .btn-small { width: auto; padding: 8px 12px; font-size: 0.5rem; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .chip {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.3); border: 1px dashed var(--border-color);
            padding: 6px 10px; font-size: 1.2rem;
        }
        .chip button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.2rem; }

        .role-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px dashed rgba(168, 85, 247, 0.18);
        }
        .role-row:last-child { border-bottom: none; }
        .role-info { font-size: 1.1rem; flex-grow: 1; padding-right: 10px; }
        .role-name { font-weight: 600; color: var(--text-main); }
        .role-desc { font-size: 0.95rem; color: var(--text-sub); line-height: 1.3; }

        .stepper { display: flex; align-items: center; gap: 8px; }
        .stepper button {
            width: 30px; height: 30px; background: var(--accent-glow);
            border: 2px solid var(--accent); color: #fff; cursor: pointer;
            font-family: var(--font-display); font-size: 0.6rem;
        }
        .stepper span { font-family: var(--font-display); font-size: 0.7rem; min-width: 22px; text-align: center; color: var(--moon); }

        .checkbox-row { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; cursor: pointer; }
        .checkbox-row input { accent-color: var(--accent); width: 18px; height: 18px; }

        .card-reveal {
            border: 2px dashed var(--accent);
            padding: 26px 18px; text-align: center; margin: 18px 0;
            background: var(--accent-glow);
            box-shadow: inset 0 0 26px rgba(168,85,247,0.15);
        }
        .role-badge {
            font-family: var(--font-display); font-size: 0.95rem;
            color: var(--moon); text-transform: uppercase; margin: 14px 0;
            letter-spacing: 0.04em; line-height: 1.5;
            text-shadow: 0 0 10px rgba(255,225,77,0.6);
        }

        .select-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
        .select-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.30); border: 2px solid var(--border-color);
            padding: 13px 14px; color: #fff; font-size: 1.1rem; cursor: pointer;
            transition: transform 0.1s steps(2), border-color 0.1s, background 0.1s;
        }
        .select-item:hover { transform: translateX(3px); border-color: var(--accent); }
        .select-item.selected { border-color: var(--moon); background: var(--accent-glow); box-shadow: 0 0 14px rgba(168,85,247,0.3); }
        .select-item.dead { opacity: 0.35; text-decoration: line-through; cursor: not-allowed; }

        .alive-summary { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
        .alive-pill {
            font-size: 1rem; padding: 5px 9px;
            background: rgba(0,0,0,0.30); border: 1px solid var(--border-color);
        }
        .alive-pill.dead { text-decoration: line-through; opacity: 0.30; }

        .codebox { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: 0.2em; color: var(--moon); text-align: center; padding: 15px; background: #070510; border: 2px dashed var(--border-color); margin: 10px 0; }
        .linkbtn { background: none; border: none; color: var(--text-sub); font-size: 1.1rem; cursor: pointer; text-decoration: underline; display: block; margin: 10px auto; font-family: var(--font-body); }
        .center { text-align: center; }
        .dim { color: var(--text-sub); }
        .warn { color: #ff5555; font-size: 1rem; margin-top: 6px; }
        .inline2 { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    const ROLES_DEF = {
        loup: { name: "Loup-Garou", team: "loups", icon: "🐺", desc: "Dévore un villageois chaque nuit avec la meute." },
        infect: { name: "Infect Père des Loups", team: "loups", icon: "🩸", desc: "Loup pouvant infecter sa victime." },
        loup_blanc: { name: "Loup Blanc", team: "solo", icon: "🐺⚪", desc: "Peut éliminer un loup une nuit sur deux." },
        corbeau: { name: "Le Corbeau", team: "village", icon: "🐦‍⬛", desc: "Ajoute 1 voix de pénalité à un joueur chaque nuit." },
        chevalier: { name: "Chevalier Rouillé", team: "village", icon: "🗡️", desc: "Empoisonne le loup qui le dévore." },
        joueur_flute: { name: "Joueur de Flûte", team: "solo", icon: "🪈", desc: "Charme des joueurs et gagne s'ils sont tous charmés." },
        voyante: { name: "Voyante", team: "village", icon: "🔮", desc: "Découvre le rôle d'un joueur chaque nuit." },
        sorciere: { name: "Sorcière", team: "village", icon: "🧪", desc: "Possède une potion de vie et de mort." },
        chasseur: { name: "Chasseur", team: "village", icon: "🏹", desc: "Tire sur quelqu'un en mourant." },
        garde: { name: "Garde", team: "village", icon: "🛡️", desc: "Protège quelqu'un chaque nuit." },
        petite_fille: { name: "Petite Fille", team: "village", icon: "👧", desc: "Espionne les loups." },
        cupidon: { name: "Cupidon", team: "village", icon: "💘", desc: "Forme un couple d'amoureux." },
        ange: { name: "Ange", team: "solo", icon: "🪽", desc: "Gagne s'il est éliminé au premier tour." },
        villageois: { name: "Simple Villageois", team: "village", icon: "🧑‍🌾", desc: "Aucun pouvoir particulier." }
    };

    var peer = null;
    var conn = null;
    var connections = [];
    var isHost = false;
    var myName = "";
    var roomCode = "";

    var state = {
        gameMode: null,
        screen: "mode_select",
        players: ["Joueur 1", "Joueur 2", "Joueur 3", "Joueur 4", "Joueur 5", "Joueur 6"],
        roleCounts: {
            loup: 1, infect: 0, loup_blanc: 0, corbeau: 0, chevalier: 0, joueur_flute: 0,
            voyante: 1, sorciere: 1, chasseur: 0,
            garde: 0, petite_fille: 0, cupidon: 0, ange: 0
        },
        gamePlayers: [],
        nightNumber: 1,
        nightStep: 0,
        nightActions: {},
        witchPotions: { heal: true, death: true },
        lovers: [],
        infectedPlayerId: null,
        corbeauTargetId: null,
        charmedPlayerIds: [],
        hunterPending: null,
        dayDeaths: [],
        selectedTarget: null,
        voyanteRevealedTargetId: null,
        wolfVotes: {},
        villageVotes: {},
        tieMessage: "",
        firstDayVotePassed: false,
        winner: null
    };

    function selectMode(mode) {
        state.gameMode = mode;
        if(mode === "local") {
            state.screen = "setup";
            render();
        } else {
            state.screen = "net_host_or_join";
            render();
        }
    }

    function generateRoomCode() {
        var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        var code = "";
        for(var i=0; i<4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        return code;
    }

    function startHosting() {
        var nameInput = document.getElementById("pseudoHost");
        if(!nameInput || !nameInput.value.trim()) { alert("Entre ton pseudo d'hôte !"); return; }
        
        myName = nameInput.value.trim();
        isHost = true;
        roomCode = generateRoomCode();
        state.players = [myName];

        if(peer) peer.destroy();
        peer = new Peer(roomCode);

        peer.on('open', function(id) {
            state.screen = "setup";
            render();
        });

        peer.on('connection', function(c) {
            connections.push(c);
            c.on('data', function(data) {
                if(data.type === "JOIN") {
                    if(!state.players.includes(data.name)) {
                        state.players.push(data.name);
                    }
                    broadcastState();
                    render();
                } else if(data.type === "WOLF_VOTE") {
                    state.wolfVotes[data.playerId] = data.targetId;
                    checkWolvesConsensus();
                    broadcastState();
                } else if(data.type === "VILLAGE_VOTE") {
                    state.villageVotes[data.playerId] = data.targetId;
                    checkVillageConsensus();
                    broadcastState();
                }
            });
        });
    }

    function broadcastState() {
        connections.forEach(function(c) {
            c.send({ type: "STATE_UPDATE", data: state });
        });
    }

    function joinRoomForm() {
        isHost = false;
        state.screen = "join_form";
        render();
    }

    function connectToRoom() {
        var nameInput = document.getElementById("pseudoJoin");
        var codeInput = document.getElementById("roomCodeInput");
        if(!nameInput.value.trim() || !codeInput.value.trim()) { alert("Remplis tous les champs !"); return; }
        
        myName = nameInput.value.trim();
        roomCode = codeInput.value.trim().toUpperCase();

        if(peer) peer.destroy();
        peer = new Peer();

        peer.on('open', function(id) {
            conn = peer.connect(roomCode);

            conn.on('open', function() {
                conn.send({ type: "JOIN", name: myName });
                state.screen = "waiting_room";
                render();
            });

            conn.on('data', function(data) {
                if(data.type === "STATE_UPDATE") {
                    state = data.data;
                    render();
                }
            });
        });
    }

    function toggleFullscreen(){
        var isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if(!isFs){
            var el = document.documentElement;
            if(el.requestFullscreen) el.requestFullscreen();
        } else {
            if(document.exitFullscreen) document.exitFullscreen();
        }
    }
    document.addEventListener("fullscreenchange", function(){ render(); });

    function shuffle(array) {
        let arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function addPlayer() {
        if(state.gameMode === "network") return;
        const input = document.getElementById("playerNameInput");
        const name = input ? input.value.trim() : "";
        if (!name) return;
        state.players.push(name);
        render();
    }

    function removePlayer(index) {
        if(state.gameMode === "network") return;
        state.players.splice(index, 1);
        render();
    }

    function updateRoleCount(roleKey, delta) {
        if(state.gameMode === "network" && !isHost) return;
        state.roleCounts[roleKey] = Math.max(0, (state.roleCounts[roleKey] || 0) + delta);
        if(state.gameMode === "network") broadcastState();
        render();
    }

    function getSpecialRolesTotal() {
        return Object.values(state.roleCounts).reduce((a, b) => a + b, 0);
    }

    function startDistribution() {
        if(state.gameMode === "network" && !isHost) return;
        const totalSpecial = getSpecialRolesTotal();
        if (state.players.length < 4) {
            alert("Il faut au minimum 4 joueurs pour démarrer.");
            return;
        }
        if (totalSpecial > state.players.length) {
            alert("Vous avez configuré plus de rôles spéciaux que de joueurs.");
            return;
        }

        let deck = [];
        for (const [role, count] of Object.entries(state.roleCounts)) {
            for (let i = 0; i < count; i++) deck.push(role);
        }
        while (deck.length < state.players.length) {
            deck.push("villageois");
        }
        deck = shuffle(deck);

        state.gamePlayers = state.players.map((name, index) => ({
            id: index,
            name: name,
            role: deck[index],
            alive: true,
            isLover: false,
            isInfected: false
        }));

        state.revealIndex = 0;
        state.revealed = false;
        state.nightNumber = 1;
        state.nightStep = 0;
        state.witchPotions = { heal: true, death: true };
        state.lovers = [];
        state.infectedPlayerId = null;
        state.corbeauTargetId = null;
        state.charmedPlayerIds = [];
        state.wolfVotes = {};
        state.villageVotes = {};
        state.tieMessage = "";
        state.voyanteRevealedTargetId = null;
        state.firstDayVotePassed = false;
        state.screen = (state.gameMode === "local") ? "reveal" : "reveal_net";
        
        if(state.gameMode === "network") broadcastState();
        render();
    }

    function getNightSteps() {
        const steps = [];
        const hasAlive = (role) => state.gamePlayers.some(p => p.role === role && p.alive);

        if (state.nightNumber === 1 && hasAlive("cupidon")) steps.push("cupidon");
        if (hasAlive("garde")) steps.push("garde");
        if (hasAlive("corbeau")) steps.push("corbeau");
        if (hasAlive("voyante")) steps.push("voyante");
        
        const wolvesAlive = state.gamePlayers.some(p => (p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected) && p.alive);
        if (wolvesAlive) steps.push("loups");

        if (hasAlive("infect") && !state.infectedPlayerId) steps.push("infect");
        if (hasAlive("loup_blanc") && state.nightNumber % 2 === 0) steps.push("loup_blanc");
        if (hasAlive("sorciere") && (state.witchPotions.heal || state.witchPotions.death)) steps.push("sorciere");
        if (hasAlive("joueur_flute")) steps.push("joueur_flute");

        return steps;
    }

    function nextNightStep() {
        if(state.gameMode === "network" && !isHost) return;
        const steps = getNightSteps();
        state.nightStep++;
        state.selectedTarget = null;
        state.wolfVotes = {};
        state.voyanteRevealedTargetId = null;

        if (state.nightStep >= steps.length) {
            resolveNight();
        } else {
            if(state.gameMode === "network") broadcastState();
            render();
        }
    }

    function checkWolvesConsensus() {
        const aliveWolves = state.gamePlayers.filter(p => (p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected) && p.alive);
        const votes = Object.values(state.wolfVotes);

        if (votes.length >= aliveWolves.length && aliveWolves.length > 0) {
            let counts = {};
            votes.forEach(targetId => { counts[targetId] = (counts[targetId] || 0) + 1; });
            
            let maxVotes = 0;
            let candidates = [];
            for (let [targetId, count] of Object.entries(counts)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    candidates = [parseInt(targetId)];
                } else if (count === maxVotes) {
                    candidates.push(parseInt(targetId));
                }
            }

            if (candidates.length > 1) {
                state.tieMessage = "Égalité entre les loups ! Veuillez revoter.";
                state.wolfVotes = {};
                if(state.gameMode === 'network') broadcastState();
                render();
                return;
            }

            state.tieMessage = "";
            state.nightActions.wolfVictim = candidates[0];
            nextNightStep();
        }
    }

    function checkVillageConsensus() {
        const aliveVillagers = state.gamePlayers.filter(p => p.alive);
        const votes = Object.values(state.villageVotes);

        if (votes.length >= aliveVillagers.length && aliveVillagers.length > 0) {
            let counts = {};
            votes.forEach(targetId => { counts[targetId] = (counts[targetId] || 0) + 1; });
            
            if (state.corbeauTargetId !== null && counts[state.corbeauTargetId]) {
                counts[state.corbeauTargetId] += 1;
            }

            let maxVotes = 0;
            let candidates = [];
            for (let [targetId, count] of Object.entries(counts)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    candidates = [parseInt(targetId)];
                } else if (count === maxVotes) {
                    candidates.push(parseInt(targetId));
                }
            }

            if (candidates.length > 1) {
                state.tieMessage = "Égalité parfaite au village ! Le vote doit être refait.";
                state.villageVotes = {};
                if(state.gameMode === 'network') broadcastState();
                render();
                return;
            }

            state.tieMessage = "";
            const condemnedId = candidates[0];
            const condemned = state.gamePlayers.find(p => p.id === condemnedId);

            if (!state.firstDayVotePassed && condemned.role === 'ange') {
                state.winner = 'Ange';
                state.screen = 'end';
                if(state.gameMode==='network') broadcastState();
                render();
                return;
            }
            state.firstDayVotePassed = true;
            killPlayer(condemned.id, 'tribunal');

            if (state.hunterPending) {
                state.screen = 'hunter';
            } else if (!checkGameEnd()) {
                state.nightNumber++;
                state.nightStep = 0;
                state.nightActions = {};
                state.screen = 'night';
            }
            if(state.gameMode==='network') broadcastState();
            render();
        }
    }

    function resolveNight() {
        let deaths = [];
        const wolfVictimId = state.nightActions.wolfVictim;
        const protectedId = state.nightActions.protected;
        const witchKillId = state.nightActions.witchKill;
        const witchSave = state.nightActions.witchSaved;
        const whiteKillId = state.nightActions.whiteKill;
        const infectedId = state.nightActions.infected;

        state.corbeauTargetId = state.nightActions.corbeauTarget !== undefined ? state.nightActions.corbeauTarget : null;

        if (wolfVictimId !== undefined && wolfVictimId !== null) {
            if (wolfVictimId !== protectedId && !witchSave) {
                const victim = state.gamePlayers.find(p => p.id === wolfVictimId);
                if (victim && victim.role === "chevalier") {
                    const aliveWolves = state.gamePlayers.filter(p => (p.role === "loup" || p.role === "infect") && p.alive);
                    if (aliveWolves.length > 0) {
                        deaths.push(aliveWolves[0].id);
                    }
                }
                if (infectedId === wolfVictimId) {
                    if (victim) {
                        victim.isInfected = true;
                        state.infectedPlayerId = victim.id;
                    }
                } else {
                    deaths.push(wolfVictimId);
                }
            }
        }

        if (whiteKillId !== undefined && whiteKillId !== null) {
            if (!deaths.includes(whiteKillId) && whiteKillId !== protectedId) {
                deaths.push(whiteKillId);
            }
        }

        if (witchKillId !== undefined && witchKillId !== null) {
            if (!deaths.includes(witchKillId)) {
                deaths.push(witchKillId);
            }
        }

        state.dayDeaths = [];
        deaths.forEach(id => killPlayer(id, "nuit"));

        const alive = state.gamePlayers.filter(p => p.alive);
        const flutist = alive.find(p => p.role === "joueur_flute");
        if (flutist && alive.every(p => state.charmedPlayerIds.includes(p.id))) {
            state.winner = "Joueur de Flûte";
            state.screen = "end";
            if(state.gameMode === "network") broadcastState();
            render();
            return;
        }

        state.screen = "day";
        checkGameEnd();
        if(state.gameMode === "network") broadcastState();
        render();
    }

    function killPlayer(id, cause) {
        const p = state.gamePlayers.find(pl => pl.id === id);
        if (!p || !p.alive) return;
        p.alive = false;
        state.dayDeaths.push({ player: p, cause: cause });

        if (p.isLover) {
            const otherLover = state.gamePlayers.find(pl => pl.isLover && pl.id !== p.id && pl.alive);
            if (otherLover) {
                otherLover.alive = false;
                state.dayDeaths.push({ player: otherLover, cause: "chagrin" });
            }
        }

        if (p.role === "chasseur") {
            state.hunterPending = p;
        }
    }

    function checkGameEnd() {
        const alive = state.gamePlayers.filter(p => p.alive);
        const wolves = alive.filter(p => p.role === "loup" || p.role === "infect" || p.role === "loup_blanc" || p.isInfected);
        const villagers = alive.filter(p => !wolves.includes(p));

        if (alive.length === 2 && alive[0].isLover && alive[1].isLover) {
            state.winner = "Amoureux";
            state.screen = "end";
            return true;
        }
        if (wolves.length === 0) {
            state.winner = "Village";
            state.screen = "end";
            return true;
        }
        if (wolves.length >= villagers.length) {
            if (wolves.length === 1 && wolves[0].role === "loup_blanc" && villagers.length === 0) {
                state.winner = "Loup Blanc";
            } else {
                state.winner = "Loups-Garous";
            }
            state.screen = "end";
            return true;
        }
        return false;
    }

    function render() {
        const app = document.getElementById("app");
        var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        
        let html = '<header><div><h1>Loup-Garou</h1><div class="subtitle">Salle d\'Arcade &middot; Multijoueur Interactif</div></div>';

            html += '<div class="panel center">';
            html += '<h2>Choix du mode</h2>';
            html += '<p class="dim" style="margin-bottom:15px;">Comment souhaitez-vous jouer ?</p>';
            html += '<button class="btn btn-primary" onclick="selectMode(\'local\')">📱 Un seul téléphone (Passe-partout)</button>';
            html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="selectMode(\'network\')">🌐 Réseau (Chacun son téléphone)</button>';
            html += '</div>';
        }

            html += '<button class="linkbtn" onclick="state.screen=\'mode_select\'; render();">&#8249; Retour</button>';

            html += '<p class="dim" style="margin-bottom:10px;">Entre ton pseudo pour créer le salon :</p>';
            html += '<input type="text" id="pseudoHost" placeholder="Ton pseudo">';
            html += '<button class="btn btn-primary" onclick="startHosting()">Créer un salon</button>';
            html += '<button class="btn btn-ghost" style="margin-top:15px;" onclick="joinRoomForm()">Rejoindre un salon existant ›</button></div>';
        }
        else if (state.screen === "join_form") {
            html += '<div class="panel"><h2>Rejoindre la partie</h2>';
            html += '<input type="text" id="pseudoJoin" placeholder="Ton pseudo">';
            html += '<input type="text" id="roomCodeInput" placeholder="Code du salon (4 lettres)" style="text-transform:uppercase;">';
            html += '<button class="btn btn-primary" onclick="connectToRoom()">Se connecter</button>';
            html += '<button class="btn btn-ghost" style="margin-top:10px;" onclick="state.screen=\'net_host_or_join\'; render();">Retour</button></div>';
        }
        else if (state.screen === "waiting_room") {
            html += '<div class="panel center"><h2>Salon d\'attente</h2>';
            html += '<p class="dim">Salon : <strong>'+roomCode+'</strong></p>';
            html += '<p class="dim" style="margin-top:15px;">En attente que l\'hôte lance la partie...</p></div>';
        }
        else if (state.screen === "setup") {
            if(state.gameMode === "network" && isHost) {
                html += '<div class="panel center"><h2>Code du salon : <span style="color:var(--moon)">'+roomCode+'</span></h2><p class="dim">Partage ce code. Chaque joueur contrôlera son rôle.</p></div>';
            }
            html += renderSetup();
        }
        else if (state.screen === "reveal") html += renderRevealLocal();
        else if (state.screen === "reveal_net") html += renderRevealNet();
        else if (state.screen === "night") html += renderNight();
        else if (state.screen === "waiting_vote") {
            const aliveCount = state.gamePlayers.filter(p => p.alive).length;
            const votedCount = Object.keys(state.villageVotes).length + Object.keys(state.wolfVotes).length;
            html += `
                <h1>⏳ Vote en cours</h1>
                <div class="panel center" style="padding:40px 20px;">
                    <h2>Votre vote a bien été pris en compte !</h2>
                    <p class="dim" style="margin-top:15px;">Votes enregistrés : ${votedCount} / ${aliveCount}</p>
                    <p class="dim" style="margin-top:5px;">En attente des autres joueurs...</p>
                </div>
            `;
        }
        else if (state.screen === "day") html += renderDay();
        else if (state.screen === "vote") html += renderVote();
        else if (state.screen === "hunter") html += renderHunter();
        else if (state.screen === "end") html += renderEnd();

        app.innerHTML = html;

        var ni = document.getElementById("playerNameInput");
        if(ni){ ni.addEventListener("keydown", function(e){ if(e.key==="Enter") addPlayer(); }); }
        var ph = document.getElementById("pseudoHost");
        if(ph){ ph.addEventListener("keydown", function(e){ if(e.key==="Enter") startHosting(); }); }
        var pj = document.getElementById("pseudoJoin");
        if(pj){ pj.addEventListener("keydown", function(e){ if(e.key==="Enter") connectToRoom(); }); }
    }

    function renderSetup() {
        const totalSpecial = getSpecialRolesTotal();
        const totalPlayers = state.players.length;
        const simpleVillagers = Math.max(0, totalPlayers - totalSpecial);
        const disableControls = (state.gameMode === "network" && !isHost);

        let chipsHtml = state.players.map((p, i) => `
            <div class="chip">
                <span>${p}</span>
                ${(!disableControls && totalPlayers > 1) ? `<button onclick="removePlayer(${i})">✕</button>` : ""}
            </div>
        `).join("");

        let rolesHtml = Object.entries(ROLES_DEF).filter(([k]) => k !== "villageois").map(([key, r]) => `
            <div class="role-row">
                <div class="role-info">
                    <div class="role-name">${r.icon} ${r.name}</div>
                    <div class="role-desc">${r.desc}</div>
                </div>
                <div class="stepper">
                    ${disableControls ? '' : `<button onclick="updateRoleCount('${key}', -1)">−</button>`}
                    <span>${state.roleCounts[key] || 0}</span>
                    ${disableControls ? '' : `<button onclick="updateRoleCount('${key}', 1)">+</button>`}
                </div>
            </div>
        `).join("");

        let html = "";
        html += `<div class="panel"><h2>Joueurs inscrits (${totalPlayers})</h2><div class="chips">${chipsHtml}</div>`;
        if(!disableControls) {
            html += `<div class="inline2"><input type="text" id="playerNameInput" placeholder="Nom du joueur"><button class="btn btn-ghost btn-small" onclick="addPlayer()">+</button></div>`;
        }
        html += `</div>`;

        html += `<div class="panel"><h2>Rôles & Composition (${totalSpecial} spéciaux + ${simpleVillagers} villageois)</h2>${rolesHtml}</div>`;

        if(!disableControls) {
            html += `<button class="btn btn-primary" onclick="startDistribution()">Distribuer les rôles ›</button>`;
        } else {
            html += `<p class="center dim" style="margin-top:15px;">En attente que l'hôte lance la partie...</p>`;
        }
        return html;
    }

    function renderRevealLocal() {
        const p = state.gamePlayers[state.revealIndex];
        const role = ROLES_DEF[p.role];

        if (!state.revealed) {
            return `
                <h1>Transmission du rôle</h1>
                <p class="phase-subtitle">Joueur ${state.revealIndex + 1} / ${state.gamePlayers.length}</p>
                <div class="card-reveal">
                    <p style="color:var(--text-sub);">Donnez le téléphone à</p>
                    <h2 style="font-size:1.4rem; margin:10px 0; color:var(--text-main);">${p.name}</h2>
                    <button class="btn btn-primary" style="margin-top:16px;" onclick="state.revealed=true; render();">👁️ Révéler mon rôle</button>
                </div>
            `;
        }

        return `
            <h1>Votre Rôle Secret</h1>
            <p class="phase-subtitle">${p.name}</p>
            <div class="card-reveal">
                <div style="font-size:3rem;">${role.icon}</div>
                <div class="role-badge">${role.name}</div>
                <p style="font-size:1.1rem; color:var(--text-sub); line-height:1.4;">${role.desc}</p>
            </div>
            <button class="btn btn-ghost" onclick="
                if (state.revealIndex + 1 < state.gamePlayers.length) {
                    state.revealIndex++; state.revealed = false; render();
                } else {
                    state.screen = 'night'; render();
                }
            ">Cacher et passer au joueur suivant ›</button>
        `;
    }

    function renderRevealNet() {
        const myRoleObj = state.gamePlayers.find(p => p.name.toLowerCase() === myName.toLowerCase());
        const rDef = myRoleObj ? ROLES_DEF[myRoleObj.role] : { name: "Villageois", icon: "🧑‍🌾", desc: "..." };

        return `
            <h1>Votre Rôle Secret</h1>
            <div class="card-reveal">
                <div style="font-size:3rem;">${rDef.icon}</div>
                <div class="role-badge">${rDef.name}</div>
                <p style="font-size:1.1rem; color:var(--text-sub); line-height:1.4;">${rDef.desc}</p>
            </div>
            ${isHost ? `<button class="btn btn-primary" onclick="state.screen='night'; broadcastState(); render();">Lancer la première nuit ›</button>` : `<p class="center dim">En attente du lancement de la première nuit par l'hôte...</p>`}
        `;
    }

    function renderNight() {
        const steps = getNightSteps();
        const currentStep = steps[state.nightStep];
        const alivePlayers = state.gamePlayers.filter(p => p.alive);
        const myPlayer = state.gamePlayers.find(p => p.name.toLowerCase() === myName.toLowerCase());

        let isMyTurn = false;
        if (state.gameMode === "local") {
            isMyTurn = true;
        } else {
            if (currentStep === "cupidon" && myPlayer && myPlayer.role === "cupidon" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "garde" && myPlayer && myPlayer.role === "garde" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "corbeau" && myPlayer && myPlayer.role === "corbeau" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "voyante" && myPlayer && myPlayer.role === "voyante" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "loups" && myPlayer && (myPlayer.role === "loup" || myPlayer.role === "infect" || myPlayer.role === "loup_blanc" || myPlayer.isInfected) && myPlayer.alive) isMyTurn = true;
            if (currentStep === "infect" && myPlayer && myPlayer.role === "infect" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "loup_blanc" && myPlayer && myPlayer.role === "loup_blanc" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "sorciere" && myPlayer && myPlayer.role === "sorciere" && myPlayer.alive) isMyTurn = true;
            if (currentStep === "joueur_flute" && myPlayer && myPlayer.role === "joueur_flute" && myPlayer.alive) isMyTurn = true;
        }

        if (!isMyTurn && state.gameMode === "network") {
            return `
                <h1>🌙 Nuit ${state.nightNumber}</h1>
                <div class="panel center" style="padding:40px 20px;">
                    <div style="font-size: 3rem; margin-bottom: 15px;">💤</div>
                    <h2>Fermez les yeux...</h2>
                    <p class="dim" style="margin-top: 10px;">Ce n'est pas votre tour ou vous dormez.</p>
                </div>
            `;
        }

        let contentHtml = "";

        if (currentStep === "cupidon") {
            contentHtml = `
                <h2>💘 Cupidon</h2>
                <p class="phase-subtitle">Choisissez deux amoureux.</p>
                <div class="select-list">
                    ${alivePlayers.map(p => `
                        <div class="select-item ${(state.lovers.includes(p.id)) ? 'selected' : ''}" onclick="
                            if (state.lovers.includes(${p.id})) {
                                state.lovers = state.lovers.filter(id => id !== ${p.id});
                            } else if (state.lovers.length < 2) {
                                state.lovers.push(${p.id});
                            }
                            render();
                        ">
                            <span>${p.name}</span>
                            <span>${state.lovers.includes(p.id) ? '❤️' : ''}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-primary" ${state.lovers.length === 2 ? "" : "disabled"} onclick="
                    state.gamePlayers.forEach(p => p.isLover = state.lovers.includes(p.id));
                    nextNightStep();
                ">Valider ›</button>
            `;
        } else if (currentStep === "garde") {
            contentHtml = `
                <h2>🛡️ Le Garde</h2>
                <p class="phase-subtitle">Protégez un joueur.</p>
                <div class="select-list">
                    ${alivePlayers.map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-primary" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                    state.nightActions.protected = state.selectedTarget;
                    nextNightStep();
                ">Protéger ›</button>
            `;
        } else if (currentStep === "corbeau") {
            contentHtml = `
                <h2>🐦‍⬛ Le Corbeau</h2>
                <p class="phase-subtitle">Maudissez un joueur.</p>
                <div class="select-list">
                    ${alivePlayers.map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-primary" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                    state.nightActions.corbeauTarget = state.selectedTarget;
                    nextNightStep();
                ">Maudire ›</button>
            `;
        } else if (currentStep === "voyante") {
            const targetObj = state.gamePlayers.find(p => p.id === state.voyanteRevealedTargetId);
            contentHtml = `
                <h2>🔮 La Voyante</h2>
                <p class="phase-subtitle">Découvrez le rôle d'un unique joueur.</p>
                
                ${state.voyanteRevealedTargetId !== null && targetObj ? `
                    <div class="card-reveal" style="margin:10px 0;">
                        <p style="color:var(--text-sub);">Identité de ${targetObj.name} :</p>
                        <div class="role-badge">${ROLES_DEF[targetObj.role].icon} ${ROLES_DEF[targetObj.role].name}</div>
                    </div>
                    <button class="btn btn-primary" onclick="nextNightStep()">J'ai vu, continuer ›</button>
                ` : `
                    <div class="select-list">
                        ${alivePlayers.map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name}</span>
                            </div>
                        `).join("")}
                    </div>
                    <button class="btn btn-primary" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                        state.voyanteRevealedTargetId = state.selectedTarget;
                        render();
                    ">Voir son rôle ›</button>
                `}
            `;
        } else if (currentStep === "loups") {
            contentHtml = `
                <h2>🐺 Les Loups-Garous</h2>
                <p class="phase-subtitle">Désignez une victime commune (Égalité = vote refait).</p>
                ${state.tieMessage ? `<p style="color:var(--amber); text-align:center; font-weight:bold;">${state.tieMessage}</p>` : ""}
                <div class="select-list">
                    ${alivePlayers.map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                    if(state.gameMode === 'network') {
                        conn.send({ type: 'WOLF_VOTE', playerId: myPlayer.id, targetId: state.selectedTarget });
                        state.screen = 'waiting_vote';
                        render();
                    } else {
                        state.nightActions.wolfVictim = state.selectedTarget;
                        nextNightStep();
                    }
                ">Voter cette victime ›</button>
            `;
        } else if (currentStep === "infect") {
            contentHtml = `
                <h2>🩸 Infect Père des Loups</h2>
                <p class="phase-subtitle">Voulez-vous infecter la victime ?</p>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn btn-danger" onclick="state.nightActions.infected = state.nightActions.wolfVictim; nextNightStep();">Infecter</button>
                    <button class="btn btn-ghost" onclick="nextNightStep()">Ne pas infecter</button>
                </div>
            `;
        } else if (currentStep === "loup_blanc") {
            contentHtml = `
                <h2>🐺⚪ Loup Blanc</h2>
                <p class="phase-subtitle">Éliminer un autre loup ?</p>
                <div class="select-list">
                    ${alivePlayers.filter(p => p.role === "loup" || p.role === "infect" || p.isInfected).map(p => `
                        <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                            <span>${p.name}</span>
                        </div>
                    `).join("")}
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="state.nightActions.whiteKill = state.selectedTarget; nextNightStep();">Tuer</button>
                    <button class="btn btn-ghost" onclick="nextNightStep()">Passer</button>
                </div>
            `;
        } else if (currentStep === "sorciere") {
            const victim = state.gamePlayers.find(p => p.id === state.nightActions.wolfVictim);
            contentHtml = `
                <h2>🧪 La Sorcière</h2>
                <p class="phase-subtitle">Victime des loups : <strong>${victim ? victim.name : "Personne"}</strong></p>
                ${state.witchPotions.heal && victim ? `
                    <button class="btn" style="background: var(--green); color: #06210f; margin-bottom:20px;" onclick="
                        state.nightActions.witchSaved = true;
                        state.witchPotions.heal = false;
                        render();
                    ">💚 Potion de vie</button>
                ` : ""}
                ${state.witchPotions.death ? `
                    <div class="select-list">
                        <p style="font-size:1rem; color:var(--text-sub);">Potion de mort :</p>
                        ${alivePlayers.map(p => `
                            <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                                <span>${p.name}</span>
                            </div>
                        `).join("")}
                    </div>
                ` : ""}
                <button class="btn btn-primary" style="margin-top: 16px;" onclick="
                    if (state.selectedTarget !== null && state.witchPotions.death) {
                        state.nightActions.witchKill = state.selectedTarget;
                        state.witchPotions.death = false;
                    }
                    nextNightStep();
                ">Terminer ›</button>
            `;
        } else if (currentStep === "joueur_flute") {
            contentHtml = `
                <h2>🪈 Joueur de Flûte</h2>
                <p class="phase-subtitle">Charmer 2 joueurs :</p>
                <div class="select-list">
                    ${alivePlayers.map(p => `
                        <div class="select-item ${(state.nightActions.charmedTemp || []).includes(p.id) ? 'selected' : ''}" onclick="
                            if(!state.nightActions.charmedTemp) state.nightActions.charmedTemp = [];
                            if(state.nightActions.charmedTemp.includes(${p.id})) {
                                state.nightActions.charmedTemp = state.nightActions.charmedTemp.filter(id => id !== ${p.id});
                            } else if(state.nightActions.charmedTemp.length < 2) {
                                state.nightActions.charmedTemp.push(${p.id});
                            }
                            render();
                        ">
                            <span>${p.name}</span>
                            <span>${(state.charmedPlayerIds.includes(p.id) || (state.nightActions.charmedTemp||[]).includes(p.id)) ? '🎶' : ''}</span>
                        </div>
                    `).join("")}
                </div>
                <button class="btn btn-primary" onclick="
                    if(state.nightActions.charmedTemp) {
                        state.nightActions.charmedTemp.forEach(id => {
                            if(!state.charmedPlayerIds.includes(id)) state.charmedPlayerIds.push(id);
                        });
                    }
                    nextNightStep();
                ">Valider ›</button>
            `;
        }

        return `
            <h1>🌙 Nuit ${state.nightNumber}</h1>
            <div class="panel">${contentHtml}</div>
        `;
    }

    function renderDay() {
        let summaryDeaths = "";
        if (state.dayDeaths.length === 0) {
            summaryDeaths = "<p style='color:var(--green); font-weight:bold; margin:14px 0; text-align:center;'>Personne n'est mort cette nuit ! 🎉</p>";
        } else {
            summaryDeaths = `
                <div style="margin:14px 0;">
                    <p style="color:var(--red); font-weight:bold; margin-bottom:8px;">Victimes de la nuit :</p>
                    ${state.dayDeaths.map(d => `
                        <div class="select-item dead" style="margin-bottom:6px;">
                            <span>${d.player.name} (${ROLES_DEF[d.player.role].name})</span>
                            <span style="font-size:0.9rem; text-transform:uppercase; color:var(--red);">${d.cause}</span>
                        </div>
                    `).join("")}
                </div>
            `;
        }

        const aliveHtml = state.gamePlayers.map(p => `
            <div class="alive-pill ${p.alive ? '' : 'dead'}">${p.name}</div>
        `).join("");

        return `
            <h1>☀️ Village de Jour</h1>
            <p class="phase-subtitle">Cycle du Jour ${state.nightNumber}</p>
            <div class="panel">
                ${summaryDeaths}
                <div class="alive-summary">${aliveHtml}</div>
            </div>
            <button class="btn btn-primary" onclick="
                if (state.hunterPending) {
                    state.screen = 'hunter';
                } else {
                    state.screen = 'vote';
                }
                state.selectedTarget = null;
                if(state.gameMode==='network') broadcastState();
                render();
            ">Passer au vote du village ›</button>
        `;
    }

    function renderVote() {
        const alive = state.gamePlayers.filter(p => p.alive);
        const myPlayer = state.gamePlayers.find(p => p.name.toLowerCase() === myName.toLowerCase());

        return `
            <h1>⚖️ Vote du Village</h1>
            <p class="phase-subtitle">Désignez l'accusé au bûcher (Égalité = vote refait).</p>
            ${state.tieMessage ? `<p style="color:var(--amber); text-align:center; font-weight:bold;">${state.tieMessage}</p>` : ""}
            <div class="select-list">
                ${alive.map(p => `
                    <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                        <span>${p.name}</span>
                        <span>${state.selectedTarget === p.id ? '🔥 Accusé' : ''}</span>
                    </div>
                `).join("")}
            </div>
            <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                if(state.gameMode === 'network') {
                    conn.send({ type: 'VILLAGE_VOTE', playerId: myPlayer.id, targetId: state.selectedTarget });
                    state.screen = 'waiting_vote';
                    render();
                } else {
                    state.villageVotes[myPlayer.id] = state.selectedTarget;
                    checkVillageConsensus();
                }
            ">Voter contre ce joueur ›</button>
        `;
    }

    function renderHunter() {
        const alive = state.gamePlayers.filter(p => p.alive);
        return `
            <h1>🏹 Dernier Tir du Chasseur</h1>
            <div class="select-list">
                ${alive.map(p => `
                    <div class="select-item ${state.selectedTarget === p.id ? 'selected' : ''}" onclick="state.selectedTarget = ${p.id}; render();">
                        <span>${p.name}</span>
                    </div>
                `).join("")}
            </div>
            <button class="btn btn-danger" ${state.selectedTarget !== null ? "" : "disabled"} onclick="
                const target = state.gamePlayers.find(p => p.id === state.selectedTarget);
                state.hunterPending = null;
                killPlayer(target.id, 'balle de chasseur');
                if (!checkGameEnd()) {
                    if (state.screen === 'day') state.screen = 'vote';
                    else {
                        state.nightNumber++;
                        state.nightStep = 0;
                        state.nightActions = {};
                        state.screen = 'night';
                    }
                }
                if(state.gameMode==='network') broadcastState();
                render();
            ">Tirer ›</button>
        `;
    }

    function renderEnd() {
        return `
            <h1>🏆 Fin de Partie</h1>
            <div class="card-reveal" style="margin:20px 0;">
                <div style="font-size:3rem;">🎉</div>
                <div class="role-badge">${state.winner} l'emporte !</div>
            </div>
            <button class="btn btn-primary" onclick="state.screen='setup'; render();">Nouvelle partie ⟳</button>
        `;
    }

    render();
</script>
</body>
</html>
